<style>
  html,body{margin:0;height:100%;background:#E7EBF1;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  #stage{position:fixed;inset:0}
  .frame{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:#E7EBF1}
  .frame.on{display:block}
  .qa{position:fixed;right:14px;bottom:calc(96px + env(safe-area-inset-bottom));z-index:50;display:flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:none;border-radius:22px;background:#14213D;color:#fff;font-size:12.5px;font-weight:800;cursor:pointer;box-shadow:0 10px 24px rgba(12,20,36,.35)}
  .qa svg{width:16px;height:16px}
  .qamenu{position:fixed;inset:0;z-index:60;background:rgba(10,16,28,.5);display:none;align-items:flex-end;justify-content:center}
  .qamenu.open{display:flex}
  .qacard{width:100%;max-width:430px;background:#fff;border-radius:22px 22px 0 0;padding:12px 16px calc(20px + env(safe-area-inset-bottom))}
  .qahandle{width:44px;height:5px;border-radius:3px;background:#DCE2EC;margin:2px auto 14px}
  .qah{font-size:11px;font-weight:800;letter-spacing:1px;color:#95A0B1;margin:0 2px 12px}
  .qab{display:flex;align-items:center;gap:12px;width:100%;background:#F5F7FA;border:1px solid #EDF0F5;border-radius:14px;padding:13px 14px;margin-bottom:9px;font-size:15px;font-weight:800;color:#14213D;cursor:pointer;text-align:left}
  .qab .n{width:26px;height:26px;flex:0 0 auto;border-radius:8px;background:#EAF1FD;color:#1B5FBF;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800}
  .qab.on{border-color:#2680EB;background:#EAF1FD}
  .qab small{display:block;font-size:11.5px;font-weight:600;color:#95A0B1;margin-top:1px}
  .qanote{font-size:11px;color:#95A0B1;font-weight:600;text-align:center;margin-top:6px;line-height:1.4}
  .pnav{position:fixed;left:0;right:0;bottom:0;z-index:40;height:74px;background:#fff;border-top:1px solid #EDF0F5;display:none;align-items:center;justify-content:space-around;padding:0 8px calc(6px + env(safe-area-inset-bottom))}
  .pnav a{display:flex;flex-direction:column;align-items:center;gap:4px;color:#AAB4C2;font-size:11px;font-weight:700;padding-top:8px;cursor:pointer}
  .pnav a.on{color:#2680EB}
  .pnav svg{width:24px;height:24px}
  @media (max-width:480px){ .pnav.active{display:flex} }

  <div id="stage">

&lt;html lang=&quot;en&quot;&gt;
&lt;head&gt;
&lt;meta charset=&quot;utf-8&quot;&gt;
&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;
&lt;title&gt;Petrilab Classroom — Home&lt;/title&gt;
&lt;style&gt;
  :root{
    --navy:#14213D; --navy2:#1E2E4F; --blue:#2680EB; --blue-dk:#1B5FBF;
    --btint:#EAF1FD; --bg:#F5F7FA; --card:#FFFFFF; --line:#EDF0F5;
    --body:#5B6675; --muted:#95A0B1; --green:#2E9E5B; --gtint:#E9F5EE;
    --amber:#C9871F;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif;
    background:#E7EBF1;min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;padding:28px 16px;
    -webkit-font-smoothing:antialiased;color:var(--navy);
  }
  .cap{font-size:12px;color:#8791A0;letter-spacing:.3px}
  .cap b{color:#5B6675}

  .phone{width:390px;border-radius:46px;background:#0C1424;
    padding:13px;box-shadow:0 30px 70px rgba(20,33,61,.28), 0 4px 14px rgba(20,33,61,.16)}
  .screen{position:relative;width:364px;height:790px;background:var(--bg);
    border-radius:34px;overflow:hidden;display:flex;flex-direction:column}

  .status{height:44px;display:flex;align-items:center;justify-content:space-between;
    padding:0 26px;font-size:13px;font-weight:700;color:var(--navy);flex:0 0 auto;background:#fff}
  .status .dots{display:flex;gap:5px;align-items:center}

  /* app bar: icon + Petrilab (left), gear (right) */
  .topbar{flex:0 0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff}
  .brandrow{display:flex;align-items:center;gap:9px}
  .brand{width:30px;height:30px;border-radius:9px;background:var(--navy);
    display:flex;align-items:center;justify-content:center}
  .bname{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
  .gear{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--body);
    box-shadow:0 2px 6px rgba(20,33,61,.05)}

  /* calendar (swipeable) */
  .calwrap{position:relative;flex:0 0 auto;background:#fff;border-bottom:1px solid var(--line);box-shadow:0 6px 12px rgba(20,33,61,.05)}
  .calwrap::before,.calwrap::after{content:&quot;&quot;;position:absolute;top:0;bottom:1px;width:22px;z-index:3;pointer-events:none}
  .calwrap::before{left:0;background:linear-gradient(to right,#fff,rgba(255,255,255,0))}
  .calwrap::after{right:0;background:linear-gradient(to left,#fff,rgba(255,255,255,0))}
  .weekscroll{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:8px 0 12px;scroll-behavior:smooth}
  .weekscroll::-webkit-scrollbar{display:none}
  .wk{flex:0 0 calc(100% - 46px);scroll-snap-align:center;display:grid;grid-template-columns:repeat(7,1fr)}
  .day{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:3px 0;border-radius:12px}
  .day:active{background:#EDF1F6}
  .day .dl{font-size:11px;font-weight:700;color:var(--muted)}
  .dnum{position:relative;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;color:var(--navy);border:1.5px solid var(--line);background:#fff}
  .dstat{width:6px;height:6px;border-radius:50%;background:transparent}
  .dstat.logged{background:var(--green)}
  .dstat.alert{background:#E0862A}
  .day.today .dl{color:var(--blue)}
  .day.today .dnum{border-color:var(--blue);color:var(--blue);background:var(--btint)}
  .day.alert .dnum{border-color:#E9C38C;background:#FDF4E6}
  .day.alert .dnum::after{content:&quot;!&quot;;position:absolute;top:-6px;right:-6px;width:15px;height:15px;
    border-radius:50%;background:#E0862A;color:#fff;font-size:10px;font-weight:800;
    display:flex;align-items:center;justify-content:center;border:1.5px solid #fff}
  .day.future .dnum{color:#AEB7C4;border-color:#EDF0F5;background:transparent}
  .day.holiday{opacity:.5}
  .day.sel .dnum{box-shadow:0 0 0 3px rgba(38,128,235,.16)}

  /* filters: toggle chips, nested subject */
  .filters{flex:0 0 auto;padding:10px 16px 11px;display:flex;flex-direction:column;gap:9px;
    border-top:1px solid var(--line);background:#fff}
  .frow{display:flex;gap:7px;overflow-x:auto}
  .frow::-webkit-scrollbar{display:none}
  .clsline{display:flex;align-items:center;gap:9px}
  #clsrow{flex:1;min-width:0}
  .flabel{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;background:none;border:none;
    font-size:12.5px;font-weight:800;color:var(--muted);padding:6px 2px;cursor:default;white-space:nowrap}
  .flabel svg{width:15px;height:15px}
  .flabel.clear{color:var(--blue);cursor:pointer}
  .fchip{flex:0 0 auto;padding:6px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);
    font-size:12.5px;font-weight:700;color:var(--body);white-space:nowrap;cursor:pointer}
  .frow[data-dim=&quot;cls&quot;] .fchip.act{background:var(--navy);color:#fff;border-color:var(--navy)}
  .frow[data-dim=&quot;sub&quot;] .fchip.act{background:var(--btint);color:var(--blue-dk);border-color:#CFE0FA}
  .subwrap{display:flex;align-items:center;gap:8px;padding-left:6px;min-height:33px}
  .subprompt{font-size:12px;color:var(--muted);font-weight:600;font-style:italic}
  .elbow{color:#B4BECB;flex:0 0 auto;display:flex;align-items:center}

  .feed{position:relative;flex:1;min-height:0;overflow-y:auto;padding:6px 18px 22px}
  .feed::-webkit-scrollbar{display:none}
  .earlier{display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:11px;color:var(--muted);font-weight:700;padding:10px 0 2px;letter-spacing:.3px}
  .dhead{font-size:11px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin:18px 2px 11px}
  .dhead.today{color:var(--blue)}

  .lentry{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
    border-radius:15px;padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 6px rgba(20,33,61,.05)}
  .ltile{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .ltile.evs{background:var(--gtint);color:var(--green)}
  .ltile.math{background:#E8F1FD;color:var(--blue)}
  .lx{flex:1;min-width:0}
  .ltt{font-size:14.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lsub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .lchk{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--gtint);color:var(--green);
    display:flex;align-items:center;justify-content:center}
  .lentry.pend{background:#FFFBF3;border-color:#F1DFB8;box-shadow:none}
  .lentry.pend .ltile{background:#FBEAC6;color:#B67A12}
  .lentry.pend .lsub{color:#B4791C}
  .logbtn2{flex:0 0 auto;background:#C9871F;color:#fff;border:none;border-radius:9px;
    font-size:12px;font-weight:800;padding:9px 14px;cursor:pointer;box-shadow:0 3px 8px rgba(201,135,31,.24)}

  .alertcard{display:flex;align-items:center;gap:12px;background:#FDF4E6;border:1px solid #EFDCB4;
    border-radius:15px;padding:13px;margin-bottom:9px}
  .acic{flex:0 0 auto;width:40px;height:40px;border-radius:11px;background:#FAE7C2;color:#B67A12;
    display:flex;align-items:center;justify-content:center}
  .acx{flex:1;min-width:0}
  .act2{font-size:14px;font-weight:800;color:#7A5310}
  .acs{font-size:11.5px;color:#9C7E42;margin-top:2px;line-height:1.3}

  .hero{position:relative;border-radius:18px;padding:16px 16px 15px;color:#fff;overflow:hidden;
    background:linear-gradient(150deg,#25406E,#16233F);box-shadow:0 12px 26px rgba(20,33,61,.22);margin-bottom:15px}
  .hero::after{content:&quot;&quot;;position:absolute;right:-40px;top:-46px;width:150px;height:150px;border-radius:50%;
    background:radial-gradient(circle,rgba(56,131,235,.5),transparent 68%)}
  .htag{position:relative;font-size:10.5px;font-weight:700;letter-spacing:.6px;color:#9FC0F0;text-transform:uppercase}
  .htt{position:relative;font-size:19px;font-weight:800;margin-top:6px}
  .hbar{position:relative;height:6px;border-radius:5px;background:rgba(255,255,255,.16);margin-top:13px;overflow:hidden}
  .hbar i{display:block;height:100%;width:40%;border-radius:5px;background:linear-gradient(90deg,#4C9AF5,#7DBBFF)}
  .hmeta{position:relative;display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px}
  .hmeta .a{color:#C7D6EE;font-weight:600}
  .hmeta .b{color:#fff;font-weight:700}
  .hbtn{position:relative;margin-top:14px;width:100%;height:44px;border:none;border-radius:12px;background:#fff;
    color:var(--navy);font-size:14.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
  .hbtn svg{color:var(--blue)}
  .reclabel{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted);margin:2px 2px 11px}
  .rgo{flex:0 0 auto;color:#C2CBD8}
  .lentry.rec{cursor:pointer}
  .lentry.rec:active{background:#F4F8FF;border-color:#CFE0FA}
  .logsmall{width:100%;margin-top:5px;background:#fff;border:1px solid var(--line);border-radius:12px;
    color:var(--body);font-size:13px;font-weight:800;padding:11px;display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer}

  .nav{flex:0 0 auto;height:74px;background:rgba(255,255,255,.96);border-top:1px solid var(--line);
    display:flex;align-items:center;justify-content:space-around;padding:0 8px 6px}
  .nav a{display:flex;flex-direction:column;align-items:center;gap:4px;
    color:#AAB4C2;font-size:11px;font-weight:700;text-decoration:none;padding-top:8px}
  .nav a.on{color:var(--blue)}

  /* Fill the screen on a real phone — drop the mock device frame */
  @media (max-width:480px){
    body{display:block;padding:0;gap:0;background:var(--bg)}
    .cap{display:none}
    .phone{width:100%;padding:0;border-radius:0;background:none;box-shadow:none}
    .screen{width:100%;height:100vh;height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top)}
    .status{display:none}
    .nav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  }

  &lt;script&gt;
    // ---------- calendar (horizontal scroll, snaps per week) ----------
    var DAYS=[&#x27;Mo&#x27;,&#x27;Tu&#x27;,&#x27;We&#x27;,&#x27;Th&#x27;,&#x27;Fr&#x27;,&#x27;Sa&#x27;,&#x27;Su&#x27;];
    var TODAY=new Date(2025,7,7);           // Thu 7 Aug
    function wkStart(off){ var d=new Date(2025,7,4); d.setDate(d.getDate()+off*7); return d; }
    function sameDay(a,b){ return a.getFullYear()==b.getFullYear()&amp;&amp;a.getMonth()==b.getMonth()&amp;&amp;a.getDate()==b.getDate(); }
    function dayCell(d,i,off){
      var isToday=sameDay(d,TODAY), isPast=(d&lt;TODAY&amp;&amp;!isToday), isWeekend=(i&gt;=5);
      var isAlert=(d.getMonth()==7 &amp;&amp; d.getDate()==5);
      var cls=&#x27;day&#x27;, dot=&#x27;&lt;span class=&quot;dstat&quot;&gt;&lt;/span&gt;&#x27;, sec=&#x27;&#x27;;
      if(isWeekend) cls+=&#x27; holiday&#x27;;
      if(isToday){ cls+=&#x27; today&#x27;; }
      else if(isAlert){ cls+=&#x27; alert&#x27;; dot=&#x27;&lt;span class=&quot;dstat alert&quot;&gt;&lt;/span&gt;&#x27;; }
      else if(isPast &amp;&amp; !isWeekend){ dot=&#x27;&lt;span class=&quot;dstat logged&quot;&gt;&lt;/span&gt;&#x27;; }
      else if(!isPast){ cls+=&#x27; future&#x27;; }
      if(off===0){ if(i===0)sec=&#x27;sec-mon&#x27;;else if(i===1)sec=&#x27;sec-tue&#x27;;else if(i===2)sec=&#x27;sec-wed&#x27;;else if(i===3)sec=&#x27;sec-today&#x27;; }
      else if(off===-1){ var pids=[&#x27;sec-jul28&#x27;,&#x27;sec-jul29&#x27;,&#x27;sec-jul30&#x27;,&#x27;sec-jul31&#x27;,&#x27;sec-aug1&#x27;]; if(i&lt;5) sec=pids[i]; }
      return &#x27;&lt;div class=&quot;&#x27;+cls+&#x27;&quot;&#x27;+(sec?&#x27; data-sec=&quot;&#x27;+sec+&#x27;&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&lt;span class=&quot;dl&quot;&gt;&#x27;+DAYS[i]+&#x27;&lt;/span&gt;&lt;span class=&quot;dnum&quot;&gt;&#x27;+d.getDate()+&#x27;&lt;/span&gt;&#x27;+dot+&#x27;&lt;/div&gt;&#x27;;
    }
    function renderCalendar(){
      var html=&#x27;&#x27;;
      for(var off=-2;off&lt;=2;off++){
        var ws=wkStart(off); html+=&#x27;&lt;div class=&quot;wk&quot;&#x27;+(off===0?&#x27; id=&quot;wk-cur&quot;&#x27;:&#x27;&#x27;)+&#x27;&gt;&#x27;;
        for(var i=0;i&lt;7;i++){ var d=new Date(ws); d.setDate(ws.getDate()+i); html+=dayCell(d,i,off); }
        html+=&#x27;&lt;/div&gt;&#x27;;
      }
      var sc=document.getElementById(&#x27;weekscroll&#x27;); sc.innerHTML=html;
      requestAnimationFrame(function(){
        var cur=document.getElementById(&#x27;wk-cur&#x27;);
        if(cur) sc.scrollLeft = cur.offsetLeft - (sc.clientWidth - cur.clientWidth)/2;
      });
    }
    (function(){
      var sc=document.getElementById(&#x27;weekscroll&#x27;);
      var dwn=false,sx=0,sl=0,moved=false;
      sc.addEventListener(&#x27;pointerdown&#x27;,function(e){ if(e.pointerType!==&#x27;mouse&#x27;)return; dwn=true;moved=false;sx=e.clientX;sl=sc.scrollLeft; });
      sc.addEventListener(&#x27;pointermove&#x27;,function(e){ if(!dwn)return; var dx=e.clientX-sx; if(Math.abs(dx)&gt;6){moved=true;sc.scrollLeft=sl-dx;} });
      window.addEventListener(&#x27;pointerup&#x27;,function(){ dwn=false; });
      sc.addEventListener(&#x27;click&#x27;,function(ev){
        if(moved){ moved=false; return; }
        var day=ev.target.closest(&#x27;.day&#x27;); if(!day) return;
        document.querySelectorAll(&#x27;.wk .day&#x27;).forEach(function(d){ d.classList.remove(&#x27;sel&#x27;); });
        day.classList.add(&#x27;sel&#x27;);
        var sec=day.getAttribute(&#x27;data-sec&#x27;);
        if(sec){ var el=document.getElementById(sec), f=document.getElementById(&#x27;feed&#x27;); if(el&amp;&amp;f) f.scrollTo({top:Math.max(0,el.offsetTop-8),behavior:&#x27;smooth&#x27;}); }
      });
    })();

    // ---------- filters (toggle + nested subject) ----------
    var SUBJ={ &#x27;5A&#x27;:[&#x27;EVS&#x27;,&#x27;Maths&#x27;],&#x27;5B&#x27;:[&#x27;EVS&#x27;],&#x27;5C&#x27;:[&#x27;EVS&#x27;],&#x27;6A&#x27;:[&#x27;Maths&#x27;,&#x27;EVS&#x27;],
      &#x27;6B&#x27;:[&#x27;Maths&#x27;],&#x27;7A&#x27;:[&#x27;Maths&#x27;,&#x27;Science&#x27;],&#x27;7B&#x27;:[&#x27;Maths&#x27;],&#x27;7C&#x27;:[&#x27;Science&#x27;],&#x27;8A&#x27;:[&#x27;Maths&#x27;,&#x27;Science&#x27;] };
    var curCls=null, curSub=null;
    function applyFilter(){
      document.querySelectorAll(&#x27;[data-cls]&#x27;).forEach(function(e){
        var okC = curCls===null || e.getAttribute(&#x27;data-cls&#x27;)===curCls;
        var okS = curSub===null || e.getAttribute(&#x27;data-sub&#x27;)===curSub;
        e.style.display=(okC&amp;&amp;okS)?&#x27;&#x27;:&#x27;none&#x27;;
      });
      document.querySelectorAll(&#x27;.dsec&#x27;).forEach(function(sec){
        if(sec.classList.contains(&#x27;today&#x27;)) return;
        var ents=sec.querySelectorAll(&#x27;[data-cls]&#x27;); if(ents.length===0) return;
        var vis=false; ents.forEach(function(e){ if(e.style.display!==&#x27;none&#x27;) vis=true; });
        sec.style.display=vis?&#x27;&#x27;:&#x27;none&#x27;;
      });
    }
    var F_FILTER=&#x27;&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M3 5h18l-7 8v5l-4 2v-7z&quot;/&gt;&lt;/svg&gt;&#x27;;
    var F_CLEAR=&#x27;&lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M6 6l12 12M18 6L6 18&quot;/&gt;&lt;/svg&gt;&#x27;;
    function updateClsLabel(){
      var el=document.getElementById(&#x27;clslabel&#x27;);
      if(curCls){ el.classList.add(&#x27;clear&#x27;); el.innerHTML=F_CLEAR+&#x27;Clear&#x27;; }
      else { el.classList.remove(&#x27;clear&#x27;); el.innerHTML=F_FILTER+&#x27;Classes&#x27;; }
    }
    function onLabelClick(){
      if(!curCls) return;
      curCls=null; curSub=null;
      document.querySelectorAll(&#x27;#clsrow .fchip&#x27;).forEach(function(c){ c.classList.remove(&#x27;act&#x27;); });
      hideSubs(); updateClsLabel(); applyFilter();
    }
    function clickCls(val,el){
      if(curCls===val){ curCls=null; curSub=null; el.classList.remove(&#x27;act&#x27;); hideSubs(); }
      else {
        curCls=val; curSub=null;
        document.querySelectorAll(&#x27;#clsrow .fchip&#x27;).forEach(function(c){ c.classList.remove(&#x27;act&#x27;); });
        el.classList.add(&#x27;act&#x27;); showSubs(val);
      }
      updateClsLabel();
      applyFilter();
    }
    window.onLabelClick=onLabelClick;
    function showSubs(cls){
      var subs=SUBJ[cls]||[], html=&#x27;&#x27;;
      subs.forEach(function(s){ html+=&#x27;&lt;button class=&quot;fchip&quot; onclick=&quot;clickSub(\&#x27;&#x27;+s+&#x27;\&#x27;,this)&quot;&gt;&#x27;+s+&#x27;&lt;/button&gt;&#x27;; });
      document.getElementById(&#x27;subrow&#x27;).innerHTML=html;
    }
    function hideSubs(){ document.getElementById(&#x27;subrow&#x27;).innerHTML=&#x27;&lt;span class=&quot;subprompt&quot;&gt;Select a class to filter by subject&lt;/span&gt;&#x27;; }
    function clickSub(val,el){
      if(curSub===val){ curSub=null; el.classList.remove(&#x27;act&#x27;); }
      else { curSub=val; document.querySelectorAll(&#x27;#subrow .fchip&#x27;).forEach(function(c){ c.classList.remove(&#x27;act&#x27;); }); el.classList.add(&#x27;act&#x27;); }
      applyFilter();
    }

    // ---------- init ----------
    renderCalendar();
    hideSubs();
    applyFilter();
    var f=document.getElementById(&#x27;feed&#x27;); if(f) f.scrollTop=f.scrollHeight;

    // Two-way sync: scrolling the feed highlights the matching date in the calendar
    var _selWk=null;
    function syncCalToFeed(){
      if(!f) return;
      var st=f.scrollTop+60, id=null;
      f.querySelectorAll(&#x27;.dsec&#x27;).forEach(function(s){ if(s.offsetTop&lt;=st) id=s.id; });
      if(!id) return;
      var day=document.querySelector(&#x27;.day[data-sec=&quot;&#x27;+id+&#x27;&quot;]&#x27;);
      document.querySelectorAll(&#x27;.day&#x27;).forEach(function(d){ d.classList.remove(&#x27;sel&#x27;); });
      if(day){
        day.classList.add(&#x27;sel&#x27;);
        var wk=day.closest(&#x27;.wk&#x27;), sc=document.getElementById(&#x27;weekscroll&#x27;);
        if(wk &amp;&amp; sc &amp;&amp; wk!==_selWk){ _selWk=wk; sc.scrollLeft = wk.offsetLeft - (sc.clientWidth - wk.clientWidth)/2; }
      }
    }
    if(f){ var _raf=null; f.addEventListener(&#x27;scroll&#x27;,function(){ if(_raf) return; _raf=requestAnimationFrame(function(){ _raf=null; syncCalToFeed(); }); }); syncCalToFeed(); }
  &lt;/script&gt;

&lt;script&gt;
(function(){
  var NAME=&quot;home&quot;;
  document.addEventListener(&quot;click&quot;, function(e){
    var el=e.target; if(!el||!el.closest) return;

      var s=SUBJECTS[cur];
      var done=s.topics.filter(function(t){return t.st===&#x27;done&#x27;;}).length, total=s.topics.length;

        rows+=&#x27;&lt;div class=&quot;trow&#x27;+(t.st===&#x27;up&#x27;?&#x27; dim&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&#x27;+m+&#x27;&lt;span class=&quot;tname&quot;&gt;&#x27;+t.name+&#x27;&lt;/span&gt;&#x27;+label+&#x27;&lt;/div&gt;&#x27;;

  &lt;script&gt;
    var CHK=&#x27;&lt;svg width=&quot;13&quot; height=&quot;13&quot; viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;3.2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;&gt;&lt;path d=&quot;M5 13l4 4 10-11&quot;/&gt;&lt;/svg&gt;&#x27;;
    var KIT=[&#x27;Sprouted seeds (from last week)&#x27;,&#x27;Small pots or cups (6)&#x27;,&#x27;A bag of garden soil&#x27;,&#x27;Water bottle or can&#x27;,&#x27;A ruler, to measure height&#x27;,&#x27;Chart paper for the growth chart&#x27;];
    var STEPS=[
      {n:&#x27;Jigyasa&#x27;,m:&#x27;The hook&#x27;,t:&#x27;5 min&#x27;,sel:0,v:[
        {l:&#x27;Question&#x27;,c:&#x27;No materials · any class&#x27;,s:&#x27;Show a sprouted seed next to a dry one — ask what changed and what woke it up.&#x27;,
          d:{say:&#x27;Hold a sprouted seed in one hand and a dry seed in the other. Give the class ten seconds to look closely, then take three quick answers before you reveal anything.&#x27;,ask:[&#x27;What is different between these two seeds?&#x27;,&#x27;What do you think woke the seed up?&#x27;,&#x27;Have you seen a seed sprout at home?&#x27;],tip:&#x27;Accept every answer without correcting — right now you are collecting curiosity, not facts.&#x27;}},
        {l:&#x27;Story&#x27;,c:&#x27;No materials · quieter class&#x27;,s:&#x27;Tell a one-minute story of a seed’s journey underground.&#x27;,
          d:{say:&#x27;Tell it slowly: “Deep under the dark soil, a tiny seed lay fast asleep. One day it felt something cool and wet trickle down — water! It drank, stretched out a little root, then pushed a green shoot up toward the warm light.” Pause before the ending and let the class finish it.&#x27;,ask:[&#x27;What did the seed feel that woke it up?&#x27;,&#x27;What did it need to keep growing?&#x27;],tip:&#x27;Drop your voice for the sleeping part and lift it for the growing part — the drama holds attention.&#x27;}},
        {l:&#x27;Pass-around&#x27;,c:&#x27;Needs a sprouted seed&#x27;,s:&#x27;Pass a sprouted seed around; let children feel the tiny root and shoot.&#x27;,
          d:{say:&#x27;Place one sprouted seed in a small bowl and pass it down each row. Ask each child to gently touch the root and shoot with one finger and whisper one word for what they feel.&#x27;,ask:[&#x27;What does the root feel like?&#x27;,&#x27;Which part will become the plant?&#x27;],tip:&#x27;Set the rule “look and gentle-touch only” before you start, so the seedling survives the round.&#x27;}}
      ]},
      {n:&#x27;Bodh&#x27;,m:&#x27;The understanding&#x27;,t:&#x27;7 min&#x27;,sel:0,v:[
        {l:&#x27;Board explain&#x27;,c:&#x27;No materials&#x27;,s:&#x27;Build up water, air, warmth and light on the board; link to the textbook.&#x27;,
          d:{say:&#x27;Write four words as you say them — WATER, AIR, WARMTH, LIGHT — with a tiny picture beside each. Then point to the germination page in the textbook and match each word to the picture there.&#x27;,ask:[&#x27;Which of these does a seed get from the soil?&#x27;,&#x27;What happens if one of them is missing?&#x27;],tip:&#x27;Leave the four words on the board all lesson — you will point back to them in every step.&#x27;}},
        {l:&#x27;Chart + book&#x27;,c:&#x27;Needs the chart&#x27;,s:&#x27;Use the growth chart and the textbook page together.&#x27;,
          d:{say:&#x27;Open the growth chart beside the textbook page. Trace the journey from seed to seedling to plant on the chart, then find the same stages in the book so children link the two.&#x27;,ask:[&#x27;Which stage are our class seeds at now?&#x27;,&#x27;What comes next on the chart?&#x27;],tip:&#x27;Let a child come up and point to today’s stage on the chart.&#x27;}},
        {l:&#x27;Pair discuss&#x27;,c:&#x27;For a confident class&#x27;,s:&#x27;Pairs list what a plant needs, then compare as a class.&#x27;,
          d:{say:&#x27;Ask each pair to whisper a list of everything a plant needs to grow. Give one minute, then take one idea from each pair and build a class list on the board.&#x27;,ask:[&#x27;Did any pair think of something the others missed?&#x27;,&#x27;Which need is easiest to forget?&#x27;],tip:&#x27;Praise unusual answers — it keeps a confident class thinking rather than repeating.&#x27;}}
      ]},
      {n:&#x27;Abhyas&#x27;,m:&#x27;The practice&#x27;,t:&#x27;8 min&#x27;,sel:0,v:[
        {l:&#x27;On the board&#x27;,c:&#x27;Whole class together&#x27;,s:&#x27;Label root, shoot and first leaves together on the board.&#x27;,
          d:{say:&#x27;Draw a simple seedling on the board. Invite children up one at a time to label root, shoot and first leaves, helping the class agree before you write each word.&#x27;,ask:[&#x27;Where does the plant drink from?&#x27;,&#x27;Which part reaches for the light?&#x27;],tip:&#x27;Draw big and low so the back row can see and a small child can reach.&#x27;}},
        {l:&#x27;Worksheet&#x27;,c:&#x27;Needs printouts&#x27;,s:&#x27;Children label a seedling on a worksheet, then check with a partner.&#x27;,
          d:{say:&#x27;Hand out the labelling worksheet. Ask children to fill in root, shoot and leaves on their own, then check with the partner beside them before you go over it together.&#x27;,ask:[&#x27;Which label were you unsure about?&#x27;,&#x27;Did you and your partner agree?&#x27;],tip:&#x27;Walk down the rows once so quieter children get a quick nod of help.&#x27;}},
        {l:&#x27;Quick oral&#x27;,c:&#x27;Low attendance · short on time&#x27;,s:&#x27;Go round the class with quick oral questions on the parts of a plant.&#x27;,
          d:{say:&#x27;Point to a part on your board sketch and ask one child to name it, then move to the next child for the next part. Keep the pace brisk and light.&#x27;,ask:[&#x27;Name this part of the plant.&#x27;,&#x27;What does it do for the plant?&#x27;],tip:&#x27;If a child is stuck, let them phone a friend — no one sits in silence.&#x27;}}
      ]},
      {n:&#x27;Prayog&#x27;,m:&#x27;The experiment&#x27;,t:&#x27;12 min&#x27;,sel:0,v:[
        {l:&#x27;Group planting&#x27;,c:&#x27;Needs kit · full class&#x27;,s:&#x27;Groups plant a seed, water it, and record today’s height.&#x27;,
          d:{say:&#x27;In groups of four, give each group a pot, soil, a sprouted seed and a little water. Walk them through: fill soil, make a small hole, place the seed, cover gently, water lightly, then measure and write today’s height.&#x27;,ask:[&#x27;How tall is your plant today?&#x27;,&#x27;Where will you keep it so it gets light?&#x27;],tip:&#x27;Give each group one clear job card so all four pairs of hands stay busy.&#x27;}},
        {l:&#x27;Class demo&#x27;,c:&#x27;Little kit · large class&#x27;,s:&#x27;Do one planting as a demo; children observe and record the starting height.&#x27;,
          d:{say:&#x27;Do one planting at the front while children gather close. Narrate each step, invite two children to help pour soil and water, and have everyone copy the starting height into their notebook.&#x27;,ask:[&#x27;What did we do first?&#x27;,&#x27;Why did we water only a little?&#x27;],tip:&#x27;Raise the pot high and turn slowly so every child sees the seed go in.&#x27;}},
        {l:&#x27;No-materials&#x27;,c:&#x27;No kit today&#x27;,s:&#x27;Draw and predict the plant’s growth this week; observe the class plant.&#x27;,
          d:{say:&#x27;With no kit today, draw a pot on the board and plant an imaginary seed together. Ask children to predict, day by day, what the plant will look like this week, and note it beside the class plant on the windowsill.&#x27;,ask:[&#x27;What will change by Friday?&#x27;,&#x27;What might slow it down?&#x27;],tip:&#x27;Turn the predictions into a simple week-chart you can check against the real class plant later.&#x27;}}
      ]},
      {n:&#x27;Prasar&#x27;,m:&#x27;The connection&#x27;,t:&#x27;8 min&#x27;,sel:0,v:[
        {l:&#x27;Discussion&#x27;,c:&#x27;Any class&#x27;,s:&#x27;Where do we see this at home and on farms? Connect to the food we eat.&#x27;,
          d:{say:&#x27;Ask where they have seen plants growing — at home, on the way to school, on a farm. Draw out that the same water, air, light and warmth story is happening everywhere, including in the food they eat.&#x27;,ask:[&#x27;Which vegetable at home grew from a seed like this?&#x27;,&#x27;What would happen to farms with no rain?&#x27;],tip:&#x27;Name a local crop the children know — it makes the science feel like their own world.&#x27;}},
        {l:&#x27;Draw &amp; share&#x27;,c:&#x27;Needs paper&#x27;,s:&#x27;Children draw a growing plant they know from home and share.&#x27;,
          d:{say:&#x27;Give two minutes for each child to draw one growing plant they know from home. Then let three or four hold up their picture and say one sentence about it.&#x27;,ask:[&#x27;Why did you choose that plant?&#x27;,&#x27;What does it need that we talked about today?&#x27;],tip:&#x27;Display the drawings on a wall garden to revisit next lesson.&#x27;}},
        {l:&#x27;Home task&#x27;,c:&#x27;Send home&#x27;,s:&#x27;Ask each child to find one growing plant at home and report tomorrow.&#x27;,
          d:{say:&#x27;Set a simple task: find one plant growing at home or nearby, notice what is helping it grow, and be ready to tell the class tomorrow. No writing needed if they prefer to just remember.&#x27;,ask:[&#x27;What will you look for on your plant?&#x27;,&#x27;Who can you ask at home about it?&#x27;],tip:&#x27;Keep it no-cost and no-writing so every child can take part.&#x27;}}
      ]}
    ];

    function setVar(i,j){
      STEPS[i].sel=j;

    function openDetail(i){
      var st=STEPS[i], v=st.v[st.sel], d=v.d;

      document.getElementById(&#x27;d_title&#x27;).textContent=st.n+&#x27; · &#x27;+v.l;

      document.getElementById(&#x27;d_time&#x27;).textContent=st.t;

      document.getElementById(&#x27;d_tip&#x27;).textContent=d.tip;
      var track=document.getElementById(&#x27;d_slidetrack&#x27;);
      if(st.slides){
        track.innerHTML=st.slides.map(function(sl,k){return &#x27;&lt;div class=&quot;slide&quot;&gt;&#x27;+sl.html+&#x27;&lt;div class=&quot;sfoot&quot;&gt;&lt;span&gt;How Plants Grow&lt;/span&gt;&lt;span&gt;&#x27;+(k+1)+&#x27; / &#x27;+st.slides.length+&#x27;&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;&#x27;;}).join(&#x27;&#x27;);
        document.getElementById(&#x27;d_dots&#x27;).innerHTML=st.slides.map(function(_,k){return &#x27;&lt;span class=&quot;sdot&#x27;+(k===0?&#x27; on&#x27;:&#x27;&#x27;)+&#x27;&quot;&gt;&lt;/span&gt;&#x27;;}).join(&#x27;&#x27;);
        document.getElementById(&#x27;d_carousel&#x27;).style.display=&#x27;&#x27;;
        track.scrollLeft=0;
      } else {
        document.getElementById(&#x27;d_carousel&#x27;).style.display=&#x27;none&#x27;;
      }
      document.getElementById(&#x27;dsheet&#x27;).classList.add(&#x27;open&#x27;);
    }
    function closeDetail(){ document.getElementById(&#x27;dsheet&#x27;).classList.remove(&#x27;open&#x27;); }
    function updateDots(){
      var tr=document.getElementById(&#x27;d_slidetrack&#x27;);
      if(!tr.clientWidth) return;
      var idx=Math.round(tr.scrollLeft/tr.clientWidth);
      document.querySelectorAll(&#x27;#d_dots .sdot&#x27;).forEach(function(d,k){ d.classList.toggle(&#x27;on&#x27;,k===idx); });
    }
    document.getElementById(&#x27;d_slidetrack&#x27;).addEventListener(&#x27;scroll&#x27;, updateDots);
    function openCast(){ document.getElementById(&#x27;castdlg&#x27;).classList.add(&#x27;open&#x27;); }
    function closeCast(){ document.getElementById(&#x27;castdlg&#x27;).classList.remove(&#x27;open&#x27;); }
    function selectDevice(name){ closeCast(); document.getElementById(&#x27;livedev&#x27;).textContent=name; document.getElementById(&#x27;liveband&#x27;).style.display=&#x27;flex&#x27;; }
    function stopCast(){ document.getElementById(&#x27;liveband&#x27;).style.display=&#x27;none&#x27;; }
    window.setVar=setVar; window.openDetail=openDetail; window.closeDetail=closeDetail;
    window.openCast=openCast; window.closeCast=closeCast; window.selectDevice=selectDevice; window.stopCast=stopCast;
  &lt;/script&gt;

  <script>
    var ORDER=['home','classes','classhub','lesson'];
    var SCREENS={home:'f-home',classes:'f-classes',classhub:'f-classhub',lesson:'f-lesson'};
    function go(name){
      ORDER.forEach(function(k){ document.getElementById(SCREENS[k]).classList.toggle('on', k===name); });
      document.querySelectorAll('.qab').forEach(function(b,i){ b.classList.toggle('on', ORDER[i]===name); });
      var pnav=document.getElementById('pnav');
      pnav.classList.toggle('active', name!=='lesson');
      var tab = name==='home' ? 'home' : ((name==='classes'||name==='classhub') ? 'classes' : '');
      pnav.querySelectorAll('a').forEach(function(a){ a.classList.toggle('on', a.getAttribute('data-t')===tab); });
      closeMenu();
    }
    function toggleMenu(){ document.getElementById('qamenu').classList.toggle('open'); }
    function closeMenu(){ document.getElementById('qamenu').classList.remove('open'); }
    window.addEventListener('message', function(e){
      var m=e.data||{}; if(typeof m!=='object') return;
      if(m.go){ go(m.go); }
      else if(m.back){ var n=m.back; go(n==='lesson'?'classhub':(n==='classhub'?'classes':'home')); }
    });
    go('home');
  </script>
