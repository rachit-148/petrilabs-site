<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Petrilab Classroom - Prototype (single editable file)</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#E7EBF1}#screen{border:0;width:100vw;height:100vh;height:100dvh;display:block}</style></head><body><iframe id="screen" title="Petrilab Classroom"></iframe>
<script type="text/html" id="s-home">
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Petrilab Classroom — Home</title>
<style>
  :root{--navy:#14213D;--navy2:#1E2E4F;--blue:#2680EB;--blue-dk:#1B5FBF;--btint:#EAF1FD;--bg:#F5F7FA;--card:#FFFFFF;--line:#EDF0F5;--body:#5B6675;--muted:#95A0B1;--green:#2E9E5B;--gtint:#E9F5EE;--purple:#6A45C0;
    --c-done:#2E9E5B;--c-prog:#3F72C4;--c-ready:#9DBEE8;--c-unprep:#D3D9E2;
    --amber:#C9871F;--amber-tint:#FDF4E6;--amber-line:#EFDCB4;--amber-ink:#7A5310;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#E7EBF1;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:28px 16px;-webkit-font-smoothing:antialiased;color:var(--navy)}
  .cap{font-size:12px;color:#8791A0}.cap b{color:#5B6675}
  .phone{width:390px;border-radius:46px;background:#0C1424;padding:13px;box-shadow:0 30px 70px rgba(20,33,61,.28),0 4px 14px rgba(20,33,61,.16)}
  .screen{position:relative;width:364px;height:790px;background:var(--bg);border-radius:34px;overflow:hidden;display:flex;flex-direction:column}
  .status{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-size:13px;font-weight:700;color:var(--navy);flex:0 0 auto;background:#fff}
  .status .dots{display:flex;gap:5px;align-items:center}
  /* header surface: app bar + filter bar, visually separated from hero */
  .header{flex:0 0 auto;background:#fff;box-shadow:0 2px 10px rgba(20,33,61,.06);border-bottom:1px solid var(--line);z-index:5}
  .topbar{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px}
  .brandrow{display:flex;align-items:center;gap:9px}
  .brandlogo{height:23px;width:auto;display:block}
  .bname{font-size:15px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
  .gear{width:38px;height:38px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--body);box-shadow:0 2px 6px rgba(20,33,61,.05)}
  .tbacts{display:flex;align-items:center;gap:8px}
  .gear.search{background:var(--navy);border-color:var(--navy);color:#fff;cursor:pointer;padding:0;box-shadow:0 4px 12px rgba(20,33,61,.22)}
  .filters{padding:2px 16px 12px;display:flex;flex-direction:column;gap:9px}
  .frow{display:flex;gap:7px;overflow-x:auto}.frow::-webkit-scrollbar{display:none}
  .clsline{display:flex;align-items:center;gap:9px}
  #clsrow{flex:1;min-width:0}
  .flabel{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;color:var(--muted);padding:6px 2px;white-space:nowrap}
  .flabel svg{width:16px;height:16px}
  .fchip{flex:0 0 auto;padding:6px 13px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:700;color:var(--body);white-space:nowrap;cursor:pointer}
  .frow[data-dim="cls"] .fchip.act{background:var(--navy);color:#fff;border-color:var(--navy);display:inline-flex;align-items:center}
  .fchip .xico{width:13px;height:13px;margin-right:6px;flex:0 0 auto}
  .subinline{display:inline-flex;align-items:center;gap:7px;flex:0 0 auto}
  .subdiv{width:1px;height:20px;background:#DCE2EC;margin:0 1px;flex:0 0 auto}
  .subchip{flex:0 0 auto;padding:6px 12px;border-radius:16px;background:#F3F6FA;border:1px dashed #CFD8E4;font-size:12px;font-weight:700;color:var(--body);white-space:nowrap;cursor:pointer}
  .subchip.act{background:var(--btint);color:var(--blue-dk);border-color:#CFE0FA;border-style:solid;display:inline-flex;align-items:center}
  .subchip .xico{width:12px;height:12px;margin-right:5px;flex:0 0 auto}
  .body{flex:1;min-height:0;overflow-y:auto;padding:20px 20px 26px}
  .body::-webkit-scrollbar{display:none}
  /* ---------- HERO 1 : dashboard ---------- */
  .greet{margin:2px 2px 24px}
  .ghi{font-size:22px;font-weight:600;color:var(--body);letter-spacing:-.3px;line-height:1.14}
  .gname{font-size:22px;font-weight:700;color:var(--body);letter-spacing:-.3px;line-height:1.14;margin-top:7px}
  .dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:0 2px 8px rgba(20,33,61,.04)}
  .dcard.bare{background:transparent;border:none;box-shadow:none;padding:2px 2px}
  .dtitle{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .dtitle .lab{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
  .dtitle .lnk{font-size:12px;font-weight:800;color:var(--blue);cursor:pointer}
  /* logging card */
  .lgcard{border-color:var(--line);background:#fff}
  .lgtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .lgic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;background:#F5F7FA;color:var(--amber);display:flex;align-items:center;justify-content:center}
  .lgx{flex:1;min-width:0}
  .lgt{font-size:14.5px;font-weight:800;color:var(--navy)}
  .lgs{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
  .lgbtn{flex:0 0 auto;background:#fff;color:var(--navy);border:1.5px solid var(--line);border-radius:10px;font-size:12.5px;font-weight:800;padding:9px 16px;cursor:pointer}
  .week{display:flex;justify-content:space-between;gap:4px}
  .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px}
  .dow{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase}
  .dnum{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:var(--body);background:#fff;border:1.5px solid var(--line)}
  .day.today .dnum{background:var(--navy);color:#fff;border-color:var(--navy)}
  .day.future .dnum{color:#C2C9D4;background:transparent;border-color:var(--line)}
  .day.holiday .dow{color:#CDD3DC}
  .day.holiday .dnum{color:#C6CCD6;background:transparent;border-color:transparent;font-weight:700}
  .ddot{width:6px;height:6px;border-radius:50%;background:transparent}
  .ddot.logged{background:var(--blue)}
  .ddot.miss{background:var(--amber)}
  .ddot.none{background:#E2E6ED}
  /* logged / all-caught-up variant */
  .lgcard.ok{border-color:var(--line);background:#fff}
  .lgcard.ok .dow{color:var(--muted)}
  .lgcard.ok .dnum{color:var(--body);border-color:var(--line);background:#fff}
  .lgcard.ok .day.today .dnum{background:var(--navy);color:#fff;border-color:var(--navy)}
  .lgcard.ok .ddot.logged{background:var(--green)}
  .lgic.ok{background:#EDF5F0;color:var(--green)}
  .lgt.ok{color:var(--navy)}.lgs.ok{color:var(--muted)}
  .lglink{background:none;border:none;color:var(--navy);font-weight:800;font-size:12.5px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
  /* funnel card */
  .funhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
  .funbig{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
  .funbig small{font-size:12px;font-weight:700;color:var(--muted);margin-left:5px}
  .funnel{display:flex;gap:0;height:14px;align-items:center;background:none;margin-bottom:14px}
  .seg{min-width:6px;height:9px}
  .seg:first-child{border-radius:5px 0 0 5px}
  .seg:last-child{border-radius:0 5px 5px 0}
  .seg:only-child{border-radius:5px}
  /* taught reads as a raised rail sitting on the lighter track.
     Fully rounded both ends; a -3px pull laps it over the next segment so the
     right curve sits ON the track instead of leaving slivers of card behind it. */
  .seg.taught{height:14px;border-radius:7px;position:relative;z-index:1;margin-right:-3px}
  .seg.taught:only-child{margin-right:0}
  /* runway bar: marker sits at the taught/ready boundary */
  .funwrap{position:relative}
  .funwrap .funnel{margin-bottom:0}
  /* % pill sits below the bar; its wedge is a child, so the pointer can be
     offset inside the pill when the pill is clamped at 0% / 100%. */
  .chipband{position:relative;height:21px;margin-top:10px}
  .pctchip{position:absolute;top:0;background:var(--navy);color:#fff;font-size:10.5px;font-weight:800;padding:2.5px 8px;border-radius:7px;white-space:nowrap}
  .pctchip .ptail{position:absolute;bottom:100%;width:0;height:0;border-left:4.5px solid transparent;border-right:4.5px solid transparent;border-bottom:5px solid var(--navy)}
  .funsub{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:9px;line-height:1.4}
  .funsub b{font-weight:800;color:var(--body)}
  /* kits merged into the syllabus card */
  .oprow{display:flex;align-items:center;gap:10px;margin-top:14px;padding:13px 13px 0;border-top:1px solid var(--line);cursor:pointer}
  .oprow:active{opacity:.65}
  .kric{flex:0 0 auto;width:32px;height:32px;border-radius:9px;background:var(--gtint);color:var(--green);display:flex;align-items:center;justify-content:center}
  /* 'left midway' = stopped, not loading: a pause mark with a slow halo pulse.
     Red tone pulls focus; the halo reuses the app's existing pulse language. */
  .kric.kit{background:var(--btint);color:var(--blue-dk)}
  /* the flask is a flex item; Chrome collapses its width from the attribute alone,
     so pin the box in CSS. 17px keeps the same optical padding as the other tiles. */
  .kric svg{flex:0 0 auto}
  .kric.kit svg{width:17px;height:17px}
  .kric.stuck{background:#FCE9E7;color:#C0453E;animation:stuckpulse 1.9s ease-out infinite}
  @keyframes stuckpulse{0%{box-shadow:0 0 0 0 rgba(192,69,62,.38)}70%{box-shadow:0 0 0 9px rgba(192,69,62,0)}100%{box-shadow:0 0 0 0 rgba(192,69,62,0)}}
  @media (prefers-reduced-motion:reduce){.kric.stuck{animation:none}}
  /* top of the ladder: unlogged days, tinted so it outranks the two plain rows */
  /* amber follows the same pattern as the other rows: tinted tile on a lighter ground */
  .oprow.alert{background:#FEF8EE;border:1px solid #F4E1C2;border-radius:12px;padding:11px 12px;margin-top:14px}
  .oprow.alert+.oprow{border-top:none;padding-top:13px}
  .kric.amber{background:#F8E7C8;color:#B4761A}
  .krt.amber{color:#7D5612}
  .krs.amber{color:#A07B38}
  .krarr.amber{color:#BE9450}
  .lchip.prog{color:var(--blue-dk);background:var(--btint);border-color:#CFE0FA}
  .krt{font-size:13px;font-weight:800;color:var(--navy)}
  .krs{font-size:11px;font-weight:700;color:var(--muted);margin-top:2px}
  .krarr{margin-left:auto;flex:0 0 auto;color:var(--muted);display:flex}
  .flegend{display:grid;grid-template-columns:1fr 1fr;gap:13px 10px}
  .lg{display:flex;align-items:center;gap:8px;cursor:pointer}
  .lgdot{width:10px;height:10px;border-radius:3px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(20,33,61,.07)}
  .lglab{font-size:12.5px;font-weight:700;color:var(--body)}
  .lgnum{font-size:12.5px;font-weight:800;color:var(--navy);margin-left:auto}
  /* single-row stats (number over label) */
  .statrow{display:flex;gap:10px;margin-top:4px}
  .stat{flex:1;min-width:0}
  .statn{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.3px;line-height:1}
  .statl{font-size:11px;font-weight:700;color:var(--muted);margin-top:5px;white-space:nowrap}
  /* kits card */
  .kits{display:flex;flex-wrap:wrap;gap:7px}
  .kit{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12.5px;font-weight:700;color:var(--navy)}
  .kit .kc{font-size:10.5px;font-weight:800;color:var(--muted)}
  .kitrow{padding:14px 0;border-top:1px solid var(--line)}
  .kitrow:first-child{border-top:none;padding-top:0}
  .kithead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .kitles{font-size:14px;font-weight:800;color:var(--navy)}
  .kittag{flex:0 0 auto;font-size:10.5px;font-weight:800;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 8px;white-space:nowrap}
  .kitnone{font-size:12px;color:var(--muted);font-weight:600}
  /* prepare CTA */
  /* prepare card — red "nothing yet" state, or quiet "next topic" state */
  .ecard{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 2px 8px rgba(20,33,61,.04);overflow:hidden;margin-top:12px}
  .ecard.unset{border-color:#E8A9A4}
  .ehd{display:flex;align-items:center;justify-content:space-between;padding:14px 15px 12px}
  .eml{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;color:var(--body)}
  .eml svg{color:var(--blue-dk)}
  .echip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:var(--navy);background:#FCE9E7;border:1px solid #F3CFCB;border-radius:10px;padding:6px 10px}
  .echip svg{color:#C0453E}
  .etags{display:flex;gap:6px;flex-wrap:wrap;padding:0 15px 14px}
  .etag{font-size:10.5px;font-weight:800;color:var(--body);background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:4px 8px;white-space:nowrap}
  .eband{padding:14px 15px 15px}
  .ecard.unset .eband{border-top:1px solid #E8A9A4}
  .elead{font-size:12.5px;font-weight:800;color:var(--navy);margin-bottom:10px}
  .esearch{display:flex;align-items:center;gap:10px;background:var(--bg);border:1.5px solid var(--line);border-radius:13px;padding:12px 14px;cursor:pointer;color:var(--muted)}
  .esearch span{flex:1;font-size:13.5px;font-weight:600}
  .esearch b{font-size:10.5px;font-weight:800;color:var(--blue-dk);background:var(--btint);border-radius:7px;padding:4px 8px;white-space:nowrap}
  /* ---------- HERO 2 : filtered class ---------- */
  .h2head{display:flex;align-items:center;justify-content:space-between;margin:2px 2px 14px}
  .h2title{font-size:19px;font-weight:800;color:var(--navy);letter-spacing:-.3px}
  .h2title small{font-size:12.5px;font-weight:700;color:var(--muted);margin-left:7px;letter-spacing:0}
  .h2clear{font-size:12px;font-weight:800;color:var(--blue);cursor:pointer;background:none;border:none}
  .subgroup{margin-bottom:6px}
  .subhd{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin:16px 2px 10px}
  .slabel{display:flex;align-items:baseline;justify-content:space-between;margin:16px 2px 10px}
  .slabel .t{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase}
  .slabel .n{font-size:11.5px;color:var(--muted);font-weight:700}
  #h2list .slabel:first-child{margin-top:-2px}
  /* hero2 subtle status footer */
  .h2foot{margin-top:16px}
  #h2list{margin-top:2px}
  /* hero2 list view */
  .listcard{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 8px rgba(20,33,61,.04);overflow:hidden;margin-bottom:2px}
  .lrow{display:flex;align-items:center;gap:12px;padding:13px 15px;border-top:1px solid var(--line)}
  .lrow:first-child{border-top:none}
  .lmain{flex:1;min-width:0}
  .ltitle{font-size:14.5px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lmeta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:2px}
  .lmetarow{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:6px}
  .lchip{font-size:10.5px;font-weight:800;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;white-space:nowrap}
  .lchip.kit{color:var(--blue-dk);background:var(--btint);border-color:#CFE0FA}
  .mprog{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--blue)}
  .mdot{width:7px;height:7px;border-radius:50%;background:var(--blue);display:inline-block;animation:livepulse 1.5s ease-out infinite}
  @keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(38,128,235,.5)}70%{box-shadow:0 0 0 6px rgba(38,128,235,0)}100%{box-shadow:0 0 0 0 rgba(38,128,235,0)}}
  .mkit{font-size:11.5px;font-weight:800;color:var(--muted)}
  .libtn{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:#F4F6FA;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--navy);cursor:pointer}
  .libtn.prep{color:var(--blue-dk);background:#F4F6FA;box-shadow:none}
  .libtn.cont{color:#fff;background:var(--blue);border-color:var(--blue)}
  .libtn.live{animation:btnpulse 1.5s ease-out infinite}
  @keyframes btnpulse{0%{box-shadow:0 0 0 0 rgba(38,128,235,.45)}70%{box-shadow:0 0 0 9px rgba(38,128,235,0)}100%{box-shadow:0 0 0 0 rgba(38,128,235,0)}}
  .libtn svg{flex:0 0 auto}
  .libtn.kit{color:var(--muted)}
  .khead{margin-top:6px}
  #kits{margin-bottom:0}
  /* collapsed Kits CTA (secondary — least important) */
  .kitcta{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:18px;cursor:pointer;box-shadow:0 2px 8px rgba(20,33,61,.04)}
  .kitcta:active{background:#FAFBFD}
  .kctaic{flex:0 0 auto;width:38px;height:38px;border-radius:11px;background:#F0F2F6;color:var(--muted);display:flex;align-items:center;justify-content:center}
  .kctax{flex:1;min-width:0}
  .kctat{font-size:13.5px;font-weight:800;color:var(--body)}
  .kctas{font-size:11.5px;color:var(--muted);font-weight:700;margin-top:2px}
  .kctaarr{flex:0 0 auto;color:var(--muted);display:flex}
  /* bottom sheet */
  .sheetwrap{position:absolute;inset:0;z-index:60;display:none}
  .sheetwrap.open{display:block}
  .sheetscrim{position:absolute;inset:0;background:rgba(12,20,36,.42);opacity:0;transition:opacity .22s ease}
  .sheetwrap.open .sheetscrim{opacity:1}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -12px 34px rgba(20,33,61,.22);transform:translateY(100%);transition:transform .28s cubic-bezier(.22,.61,.36,1);max-height:76%;display:flex;flex-direction:column}
  .sheetwrap.open .sheet{transform:translateY(0)}
  .sheethandle{width:40px;height:4px;border-radius:3px;background:#CBD3DE;margin:2px auto 12px}
  .sheethead{display:flex;align-items:center;gap:9px;margin:0 2px 12px}
  .sheettitle{font-size:17px;font-weight:800;color:var(--navy);letter-spacing:-.2px}
  .sheetsub{font-size:12px;font-weight:700;color:var(--muted)}
  .sheetx{margin-left:auto;flex:0 0 auto;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--body);cursor:pointer}
  .sheetbody{overflow-y:auto;min-height:0}
  .sheetbody::-webkit-scrollbar{display:none}
  .ptcard{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:10px;box-shadow:0 3px 9px rgba(20,33,61,.055)}
  .pttile{flex:0 0 auto;width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center}
  .pttile.evs{background:var(--gtint);color:var(--green)}.pttile.math{background:#E8F1FD;color:var(--blue)}.pttile.sci{background:#F0EAFB;color:var(--purple)}
  .pttile.todo{background:#F0F2F6;color:var(--muted)}
  .ptx{flex:1;min-width:0}
  .ptt{font-size:15px;font-weight:800;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptmeta{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  .feed{position:relative;flex:1;min-height:0;overflow-y:auto;padding:6px 18px 22px}
  .feed::-webkit-scrollbar{display:none}
  .earlier{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:var(--muted);font-weight:700;padding:10px 0 2px;letter-spacing:.3px}
  .dhead{font-size:11px;font-weight:800;letter-spacing:.9px;color:var(--muted);margin:18px 2px 11px}
  .dhead.today{color:var(--blue)}
  .lentry{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:12px 13px;margin-bottom:9px;box-shadow:0 2px 6px rgba(20,33,61,.05)}
  .ltile{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
  .ltile.evs{background:var(--gtint);color:var(--green)}
  .ltile.math{background:#E8F1FD;color:var(--blue)}
  .ltile.sci{background:#F0EAFB;color:var(--purple)}
  .lx{flex:1;min-width:0}
  .ltt{font-size:14.5px;font-weight:700;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lsub{font-size:12px;color:var(--muted);font-weight:600;margin-top:2px}
  .lchk{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--gtint);color:var(--green);display:flex;align-items:center;justify-content:center}
  .dempty{text-align:center;color:var(--muted);font-weight:600;font-size:13px;padding:34px 0}
  #dfeed .lrow.firstvis{border-top:none}
  #dfeed .lchip.cls{color:var(--navy);background:#fff;border-color:#DCE2EC}
  #dfeed .dlog{flex:0 0 auto;width:22px;height:22px;border-radius:50%;background:var(--gtint);color:var(--green);display:flex;align-items:center;justify-content:center}
  /* ---------- Insights tab ---------- */
  .inshd{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--muted);text-transform:uppercase;margin:6px 2px 13px}
  .icard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;margin-bottom:13px;box-shadow:0 2px 8px rgba(20,33,61,.04)}
  .icard .ictop{display:flex;align-items:center;gap:11px}
  .icic{flex:0 0 auto;width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center}
  .icname{font-size:13.5px;font-weight:800;color:var(--navy)}
  .ictag{margin-left:auto;flex:0 0 auto;font-size:10.5px;font-weight:800;border-radius:8px;padding:5px 9px;font-variant-numeric:tabular-nums}
  .ictag.ontrack{background:var(--gtint);color:#1F7A43}
  .ictag.behind{background:#FDF4E6;color:#B9761E}
  .icbig{font-size:22px;font-weight:800;color:var(--navy);letter-spacing:-.3px;margin-top:9px}
  .icsub{font-size:12.5px;font-weight:600;color:var(--body);line-height:1.45;margin-top:9px}
  .icard .funnel{margin-top:12px;margin-bottom:0}
  .ibrow{display:flex;align-items:center;gap:10px;margin-top:10px}
  .ibcls{flex:0 0 30px;font-size:12px;font-weight:800;color:var(--navy)}
  .ibbar{flex:1;height:8px;border-radius:5px;background:#EEF1F6;overflow:hidden}
  .ibbar i{display:block;height:100%;border-radius:5px;background:var(--c-prog)}
  .ibpct{flex:0 0 auto;font-size:11.5px;font-weight:800;color:var(--body);width:34px;text-align:right}
  .ilink{font-size:12px;font-weight:800;color:var(--blue);margin-top:12px;cursor:pointer}
  .strow{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
  .strow:first-child{border-top:none}
  .stav{flex:0 0 auto;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;color:#fff}
  .stx{flex:1;min-width:0}
  .stn{font-size:14px;font-weight:800;color:var(--navy)}
  .str{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .stflag{flex:0 0 auto;font-size:10px;font-weight:800;border-radius:7px;padding:4px 8px}
  .stflag.attn{background:#FDF4E6;color:#B9761E}
  .stflag.ok{background:var(--gtint);color:#1F7A43}
  @media (max-width:480px){
    body{display:block;padding:0;gap:0;background:var(--bg)}.cap{display:none}
    .phone{width:100%;padding:0;border-radius:0;background:none;box-shadow:none}
    .screen{width:100%;height:100vh;height:100dvh;border-radius:0;padding-top:env(safe-area-inset-top)}
    .status{display:none}.nav{padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  }
</style>
</head>

<script>
/* ---------------- data model ---------------- */
var SUBJ={'5A':['EVS','Maths'],'5B':['EVS'],'5C':['EVS'],'6A':['Maths','EVS'],'6B':['Maths'],'7A':['Maths','Science'],'7B':['Maths'],'7C':['Science'],'8A':['Maths','Science']};
var CHAP={'5A':{EVS:'Seeds & Plants',Maths:'Patterns'},'5B':{EVS:'Seeds & Plants'},'5C':{EVS:'Seeds & Plants'},'6A':{Maths:'Fractions',EVS:'Environment'},'6B':{Maths:'Fractions'},'7A':{Maths:'Integers',Science:'Acids & Bases'},'7B':{Maths:'Geometry'},'7C':{Science:'Motion'},'8A':{Maths:'Mensuration',Science:'Force & Pressure'}};
// per class/subject: done[] , prog{t,steps} , ready[{t,kits,today}] , todo[]
var DATA={
 /* Coverage is spread deliberately across the nine classes so every state of the
    syllabus card is reachable by tapping a class chip:
    5C 0% · 5B 25% · 7A 40% · 5A 54% · 6A 60% · 8A 75% · 7B 80% · 6B 90% · 7C 100% */
 '5A':{   /* 54% — the demo journey: Seeds & Germination is the in-progress topic */
   EVS:{done:['What is a Seed?','Types of Seeds','Parts of a Seed','Living & Non-living'],prog:{t:'Seeds & Germination',steps:'2 of 5 steps',kits:['Cotton wool','Cups','Water','Bean seeds'],today:true},ready:[{t:'How Plants Grow',kits:['Sprouted seeds','6 pots','Garden soil','Ruler','Chart paper']}],todo:['Parts of a Plant']},
   Maths:{done:['Counting','Place Value','Addition'],prog:null,ready:[{t:'Patterns',kits:['Pattern cards','Number beads'],today:true}],todo:['Subtraction','Multiplication']}
 },
 '5B':{   /* 25% — just getting going */
   EVS:{done:['What is a Seed?','Living & Non-living'],prog:null,ready:[{t:'Parts of a Seed',kits:['Cotton wool','Cups','Water'],today:true}],todo:['Types of Seeds','Seeds & Germination','How Plants Grow','Parts of a Plant','Plants Around Us']}
 },
 '5C':{   /* 0% — nothing taught, nothing prepared */
   EVS:{done:[],prog:null,ready:[],todo:['What is a Seed?','Types of Seeds','Parts of a Seed','Living & Non-living','Seeds & Germination','How Plants Grow','Parts of a Plant','Plants Around Us']}
 },
 '6A':{   /* 60% */
   Maths:{done:['Whole Numbers','Place Value','Addition','Subtraction','Multiplication'],prog:{t:'Fractions',steps:'3 of 6 steps',kits:['Fraction strips']},ready:[{t:'Decimals',kits:['Number line']}],todo:['Geometry']},
   EVS:{done:['Our Body','Food','Water','Air Around Us'],prog:null,ready:[{t:'Our Environment',kits:['Chart paper','Leaf samples']}],todo:['Plants','Waste Management']}
 },
 '6B':{   /* 90% — everything prepared, one topic left to teach */
   Maths:{done:['Whole Numbers','Place Value','Addition','Subtraction','Multiplication','Division','Factors','Multiples','Decimals'],prog:null,ready:[{t:'Fractions',kits:['Fraction strips']}],todo:[]}
 },
 '7A':{   /* 40% */
   Maths:{done:['Number System','Exponents','Squares'],prog:{t:'Integers',steps:'2 of 9 steps',kits:['Number line']},ready:[{t:'Fractions & Decimals',kits:[]}],todo:['Algebra','Ratio','Geometry']},
   Science:{done:['Nutrition','Heat','Transport'],prog:null,ready:[{t:'Acids & Bases',kits:['Litmus paper','Test tubes']}],todo:['Physical & Chemical Changes','Motion','Light']}
 },
 '7B':{   /* 80% */
   Maths:{done:['Number System','Exponents','Algebra','Integers','Fractions','Ratio','Perimeter','Data'],prog:null,ready:[{t:'Geometry',kits:['Geometry box','Chart paper']}],todo:['Symmetry']}
 },
 '7C':{   /* 100% — syllabus complete */
   Science:{done:['Nutrition','Heat','Motion','Light','Electricity','Acids & Bases','Weather'],prog:null,ready:[],todo:[]}
 },
 '8A':{   /* 75% */
   Maths:{done:['Rational Numbers','Exponents','Squares','Cubes','Algebra','Factorisation'],prog:null,ready:[{t:'Mensuration',kits:['Ruler','Grid paper']}],todo:['Graphs']},
   Science:{done:['Crop Production','Microorganisms','Friction','Sound','Light','Chemical Effects'],prog:null,ready:[{t:'Force & Pressure',kits:['Spring balance','Weights']}],todo:['Metals']}
 }
};
var TILECLS={EVS:'evs',Maths:'math',Science:'sci'};
/* remember where the journey started (Hero 1 = no class, Hero 2 = a class) so back returns here */
function setJourneyOrigin(){ try{ if(window.parent&&window.parent!==window&&window.parent.setOrigin) window.parent.setOrigin(curCls||''); }catch(e){} }
function openTopic(){ setJourneyOrigin(); parent.go('build','details'); }
function navPrepare(){ setJourneyOrigin(); parent.go('prepare'); }
/* lessons started but not finished — the open loops a teacher must resume */
function stuckLessons(){
  var out=[];
  for(var cl in DATA)for(var s in DATA[cl]){var d=DATA[cl][s];
    if(d.prog)out.push({title:d.prog.t,cls:cl,sub:s,steps:d.prog.steps||''});}
  return out;
}
function sheetChip(L){var c=(CHAP[L.cls]&&CHAP[L.cls][L.sub])?' &middot; '+CHAP[L.cls][L.sub]:'';return L.cls+' &middot; '+L.sub+c;}
function openSheet(kind){
  var rows,title,body;
  if(kind==='stuck'){
    rows=stuckLessons(); title='Lessons left midway';
    body=rows.map(function(L){return '<div class="lrow" onclick="openTopic()"><div class="lmain"><div class="ltitle">'+L.title+'</div><div class="lmetarow"><span class="lchip">'+sheetChip(L)+'</span><span class="lchip prog">'+L.steps+'</span></div></div><button class="libtn cont">'+iPlay()+'</button></div>';}).join('');
  } else {
    rows=readyLessons().filter(function(L){return L.kits.length;}); title='Kits for ready lessons';
    body=rows.map(function(L){return '<div class="lrow" onclick="openTopic()"><div class="lmain"><div class="ltitle">'+L.title+'</div><div class="lmetarow"><span class="lchip">'+sheetChip(L)+'</span></div></div><button class="libtn kit">'+iKit()+'</button></div>';}).join('');
  }
  document.getElementById('sheettitle').textContent=title;
  document.getElementById('sheetsub').textContent=rows.length+(rows.length===1?' lesson':' lessons');
  document.getElementById('sheetlist').innerHTML=body;
  document.getElementById('kitsheet').classList.add('open');
}
function closeSheet(){ var w=document.getElementById('kitsheet'); if(w) w.classList.remove('open'); }
/* Ordinal scale — ONE hue in two steps + a neutral. "In Progress" folds into
   Ready (it is prepared, just partly taught): it was 3 of 94, too thin to read. */
var STATE={taught:{c:'#2E9E5B',nc:'#2E9E5B',lab:'Taught',sub:'taught'},
           ready:{c:'#A8DCC0',nc:'#5E9E7C',lab:'Ready to teach',sub:'ready'},
           todo:{c:'#E3E8EF',nc:'#97A2B4',lab:'Not prepared',sub:'not prepared'}};
var FORDER=['taught','ready','todo'];
function bucket(c){return {taught:c.done,ready:c.prog+c.ready,todo:c.todo};}

/* ---------------- aggregate + render hero 1 ---------------- */
function counts(scope){ // scope: null=all, or {cls} or {cls,sub}
  var c={done:0,prog:0,ready:0,todo:0};
  for(var cl in DATA){ if(scope&&scope.cls&&cl!==scope.cls) continue;
    for(var s in DATA[cl]){ if(scope&&scope.sub&&s!==scope.sub) continue;
      var d=DATA[cl][s];
      c.done+=d.done.length; c.ready+=d.ready.length; c.todo+=d.todo.length; if(d.prog)c.prog+=1;
    }}
  return c;
}
function renderFunnel(elBar,elSub,c,elMark,elCap){
  var b=bucket(c), tot=b.taught+b.ready+b.todo;
  elBar.innerHTML=''; FORDER.forEach(function(k){
    if(!b[k])return; var seg=document.createElement('div'); seg.className='seg '+k; seg.style.flex=b[k]; seg.style.background=STATE[k].c; elBar.appendChild(seg);
  });
  var pct=tot?Math.round(100*b.taught/tot):0, at=tot?(100*b.taught/tot):0;
  if(elMark) elMark.style.left=at+'%';
  if(elCap){
    var txt=elCap.querySelector('.pctxt'); if(txt) txt.textContent=pct+'%';
    var band=elCap.parentNode, tail=elCap.querySelector('.ptail');
    /* centre the pill on the true %, then pull it back inside the card;
       the tail shifts within the pill so the pointer never lies (0% / 100%). */
    var place=function(){
      var W=band.clientWidth; if(!W)return;
      /* anchor to the MEASURED right edge of the taught rail, not a computed %,
         so flex rounding and the rail's overlap can't drift the pointer. */
      var tSeg=elBar.querySelector('.seg.taught'), xx=W*at/100;
      if(tSeg) xx=tSeg.getBoundingClientRect().right-band.getBoundingClientRect().left;
      else if(!b.taught) xx=0;
      xx=Math.max(0,Math.min(W,xx));
      var pw=elCap.offsetWidth;
      var left=Math.max(0,Math.min(W-pw,xx-pw/2));
      elCap.style.left=left+'px';
      if(tail) tail.style.left=Math.max(5,Math.min(pw-14,xx-left-4.5))+'px';
    };
    place(); requestAnimationFrame(place);
  }
  /* one subline instead of a stat row: "41 taught · 16 ready · 37 not prepared" */
  if(elSub) elSub.innerHTML=FORDER.filter(function(k){return b[k];}).map(function(k){
    return '<b>'+b[k]+'</b> '+STATE[k].sub;
  }).join(' &middot; ');
}
/* every prepared-but-not-yet-taught lesson (in-progress + ready), across all classes */
function readyLessons(){
  var out=[];
  for(var cl in DATA)for(var s in DATA[cl]){var d=DATA[cl][s];
    if(d.prog)out.push({title:d.prog.t,cls:cl,sub:s,kits:d.prog.kits||[]});
    d.ready.forEach(function(r){out.push({title:r.t,cls:cl,sub:s,kits:r.kits||[]});});
  }
  return out;
}
function lessonsToday(){
  var out=[];
  for(var cl in DATA)for(var s in DATA[cl]){var d=DATA[cl][s];
    if(d.prog&&d.prog.today)out.push({title:d.prog.t,cls:cl,sub:s,kits:d.prog.kits||[]});
    d.ready.forEach(function(r){if(r.today)out.push({title:r.t,cls:cl,sub:s,kits:r.kits||[]});});
  }
  return out;
}
/* the prepare card: 'unset' when nothing is ready anywhere in scope, otherwise the quiet next-topic version */
function prepCard(c,unset,scope){
  if(!c.todo) return '';
  var srch='<div class="esearch" onclick="navPrepare()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search a topic&hellip;</span><b>'+c.todo+' to prepare</b></div>';
  if(unset){

function renderAssess(){

  var h='';

  var pub=ASGS.filter(function(a){return a.st!=='draft'&&aInScope(a);}), students={}, ans=0;
  pub.forEach(function(a){ students[a.cls]=Math.max(students[a.cls]||0,a.total); ans+=a.assessed||a.sub_in||0; });

  h+=effrow;
  /* first-run: nothing has ever been set in this scope */
  if(!run.length&&!drafts.length&&!closed.length){
    h+='<div class="ecard unset" style="margin-top:2px">'
      +'<div class="ehd"><div class="eml"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4.5V3.5h6v1"/><path d="M8.5 13l2 2 4-4"/></svg>Homework</div><span class="echip"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Nothing yet</span></div>'
      +'<div class="etags"><span class="etag">&#8599; Competency-focussed</span><span class="etag">&#10022; AI-assessed</span><span class="etag">&#9888; Misconceptions</span><span class="etag">&#10003; Zero marking</span></div>'
      +'<div class="eband"><div class="elead">Pick a Taught Topic to Get Started</div><div class="esearch" onclick="navPrepare()"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg><span>Search a taught topic&hellip;</span></div></div></div>';
    host.innerHTML=h; return;
  }
  /* 1 · running */
  /* "caught up" only means something once this scope has actually run homework before */
  if(run.length||closed.length){
    h+='<div class="asec"><span class="t">Running</span><span class="n">'+run.length+'</span></div>';
    h+=run.length?'<div class="listcard">'+run.map(aRunCard).join('')+'</div>':'<div class="caught"><span class="dck">'+dCheck()+'</span>All caught up — nothing running</div>';
  }
  /* 2 · ready to publish */
  if(drafts.length){ h+='<div class="asec"><span class="t">Ready to publish</span><span class="n">'+drafts.length+'</span></div>'+'<div class="listcard">'+drafts.map(aDraftCard).join('')+'</div>'; }
  /* 3 · recent */
  if(closed.length){
    var show=aShowAll?closed:closed.slice(0,4);
    h+='<div class="asec"><span class="t">Recent</span>'+(closed.length>4?'<span class="more" onclick="aShowAll=!aShowAll;renderAssess()">'+(aShowAll?'Show less':'See all '+closed.length)+'</span>':'<span class="n">'+closed.length+'</span>')+'</div>';
    h+='<div class="listcard">'+show.map(aClosedRow).join('')+'</div>';

  host.innerHTML=h;
}

  else if(act==='Close'){ a.st='closed'; a.closed=new Date(ATODAY); a.score=a.type==='Activity'?null:Math.round(70+Math.random()*20); toast(a.topic+' closed · moved to Recent'); renderAssess(); }
}
/* details page */
var MISC={
 'Seeds & Germination':[['Seeds need soil to sprout','9 children said soil; the three-bowl test used cotton — re-show bowl 2.','Slide 6 · Three needs'],['Dry seeds are dead','6 children; link back to the sleeping-seed story.','Slide 1 · A tiny mystery']],
 'Fractions':[['½ + ½ = 2⁄4','7 children added denominators — go back to the strips.','Slide 4 · Adding parts'],['Bigger denominator = bigger piece','5 children; compare ⅓ and ¼ strips side by side.','Slide 3 · Comparing']],
 'Types of Seeds':[['All seeds are small','4 children; show the coconut.','Slide 2 · Big and small']],
 'Motion':[['Faster means heavier','8 children; the toy-car race with equal cars.','Slide 5 · Speed'],['Stopped things have no force','6 children.','Slide 7 · Balanced forces']]
};
var ROSTER={'5A':['Aarav','Ananya','Diya','Ishaan','Kabir','Kiara','Meera','Reyansh','Riya','Saanvi','Vihaan','Zara'],'5B':['Ananya','Ishaan','Kiara','Reyansh','Saanvi','Advik','Myra','Arjun','Zara','Dev','Pihu','Yash'],'6A':['Aditi','Rohan','Tara','Neel','Sia','Om','Avni','Kabir','Ira','Veer','Nisha','Aryan'],'7A':['Aadhya','Dhruv','Esha','Kian','Lakshya','Navya','Parth','Ridhi','Samar','Tanvi','Uday','Vanya']};
var curAsg=null;
function openAsg(id){
  var a=aGet(id); if(!a)return; curAsg=a;
  var run=(a.st==='run'), pct=Math.round(100*a.sub_in/a.total);
  document.getElementById('adtitle').textContent=a.topic;
  document.getElementById('adsub').textContent=a.cls+' · '+a.sub+' · '+a.type+(run?' · due '+afmt(a.due):' · closed '+afmt(a.closed));
  var pend=a.pend||[];
  var h='<div class="dcard2">';
  /* submissions */
  h+='<div class="dband"><div class="dml">Submissions'+(run?'<span class="lk" onclick="toast(\'Due date extended to '+afmt(ad(aDays(a.due)+2))+'\')">Extend due date</span>':'')+'</div>'
    +'<div class="bignum">'+a.sub_in+' <small>of '+a.total+' · '+pct+'%</small></div>'
    +'<div class="abar" style="margin-top:9px"><div class="track"><div class="fill'+(pct<100?' part':'')+'" style="width:'+pct+'%"></div></div></div>'
    +(pend.length?'<div class="pendlist">'+pend.map(function(n){return '<span class="pend">'+n+'</span>';}).join('')+'</div>':'')+'</div>';
  /* results */
  var sc=a.score!==null&&a.score!==undefined?a.score:(a.assessed?Math.round(65+a.assessed%20):null);
  if(a.type!=='Activity'&&(a.assessed||a.score)){
    var st=Math.round((sc-40)),wk=Math.max(8,100-sc-10),md=100-st-wk;
    h+='<div class="dband"><div class="dml">Results</div><div class="bignum">'+sc+'%<small>correct</small></div>'
      +'<div class="dist"><i class="s" style="width:'+st+'%"></i><i class="m" style="width:'+md+'%"></i><i class="w" style="width:'+wk+'%"></i></div>'
      +'<div class="distleg"><span>Strong</span><span>Getting there</span><span>Needs help</span></div>'
      +'<div class="comp">&#8599; '+({EVS:'Life processes · Germination',Maths:'Number sense · '+a.topic,Science:'Physical world · '+a.topic}[a.sub])+'</div></div>';
  }
  h+='</div>';
  /* misconceptions */
  var mc=(a.flags?(MISC[a.topic]||[]).slice(0,a.flags):[]);
  if(mc.length){
    h+='<div class="dcard2"><div class="dband"><div class="dml">Misconceptions <span class="n" style="text-transform:none;letter-spacing:0;color:var(--muted)">'+mc.length+'</span></div>'
      +mc.map(function(m){ return '<div class="misc"><span class="mi"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></span><div class="mx"><div class="mt">&ldquo;'+m[0]+'&rdquo;</div><div class="ms">'+m[1]+'</div><span class="ml2" onclick="toast(\'Re-teach · '+m[2].replace(/'/g,'')+'\')">&#9654; Re-teach in 5 min · '+m[2]+'</span></div></div>'; }).join('')+'</div></div>';
  }
  /* students */
  var ros=ROSTER[a.cls]||ROSTER['5A'];
  h+='<div class="dcard2"><div class="dband"><div class="dml">Students <span class="n" style="text-transform:none;letter-spacing:0;color:var(--muted)">'+a.total+'</span></div>'
    +ros.map(function(n,i){ var p=pend.indexOf(n)>=0, rev=!p&&a.assessed<a.sub_in&&i%4===1&&run; var st=p?'Pending':rev?'To review':(run?'Assessed':'Assessed'); return '<div class="stu"><span class="av">'+n.slice(0,2)+'</span><span class="sn">'+n+'</span><span class="sc'+(p?'':rev?' rev':' ok')+'">'+st+'</span></div>'; }).join('')
    +'<div class="ecap" style="margin-top:8px">'+(a.total-ros.length)+' more</div></div></div>';
  document.getElementById('adbody').innerHTML=h;
  document.getElementById('adfoot').innerHTML=run
    ? (pend.length?'<button class="abtn ghost" onclick="aDo('+a.id+',\'Remind\')">Send reminder · '+pend.length+'</button>':'')+'<button class="abtn" onclick="aDo('+a.id+',\'Close\');closeAsg()">Close assignment</button>'
    : '<button class="abtn ghost" onclick="closeAsg()">Back</button>';
  document.getElementById('adbody').scrollTop=0;
  document.getElementById('asgDetail').style.display='';
}
function closeAsg(){ document.getElementById('asgDetail').style.display='none'; renderAssess(); }
/* publish sheet — one section at a time, same as Run the Class */
var pubId=null, pubSel=null, pubDays=1, pubDate=null;
var MON3=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'], DOW3=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function pubDue(){ return pubDate||ad(pubDays); }
function openPublish(id,cls){ var a=aGet(id); pubId=id; pubSel=cls||a.to[0]; pubDays=1; pubDate=null; pubMode='pick'; renderPublish(); document.getElementById('pubscrim').classList.add('open'); }
function closePublish(){ document.getElementById('pubscrim').classList.remove('open'); }
var pubMode='pick';
function renderPublish(){
  var a=aGet(pubId); if(!a)return;
  var back=document.getElementById('pubback');
  var hd=document.getElementById('pubhd'), sub=document.getElementById('pubsub'), x=document.getElementById('pubx');
  if(pubMode==='cal'){ back.style.display=''; hd.style.visibility='hidden'; sub.style.display='none'; x.style.display='none'; renderCal(); return; }
  back.style.display='none'; hd.style.visibility=''; sub.style.display=''; x.style.display='';
  document.getElementById('pubtt').textContent='Which class gets it?';
  document.getElementById('pubsub').textContent='One section at a time — pick the class you want to send '+a.topic+' ('+a.type+') to.';
  var sent=ASGS.filter(function(x){return x.st!=='draft'&&x.topic===a.topic&&x.type===a.type;}).map(function(x){return x.cls;});
  var rows=a.to.concat(sent).filter(function(c,i,arr){return arr.indexOf(c)===i;}).sort();
  var h='<div class="pfclasses">'+rows.map(function(c){
    var ready=a.to.indexOf(c)>=0, on=(pubSel===c);
    return '<div class="pfcls'+(on?' on':'')+'"'+(ready?' onclick="pubSel=\''+c+'\';renderPublish()"':' style="opacity:.55;cursor:default"')+'><span class="pfradio"></span><div class="pfx"><div class="pfn">Class '+c+'</div><div class="pfq">'+(ready?'Ready to send':'Already sent · answers coming in')+'</div></div><span class="pfstat '+(ready?'ready':'done')+'">'+(ready?'Ready':'In progress')+'</span></div>';
  }).join('')+'</div>';
  var chips=[]; for(var n=1;n<=7;n++){ var d=ad(n); chips.push('<button class="datechip'+(!pubDate&&pubDays===n?' on':'')+'" onclick="pubDate=null;pubDays='+n+';renderPublish()"><b>'+(n===1?'Tomorrow':DOW3[d.getDay()])+'</b>'+d.getDate()+' '+MON3[d.getMonth()]+'</button>'); }
  if(pubDate) chips.push('<button class="datechip on" onclick="openCal()"><b>'+DOW3[pubDate.getDay()]+'</b>'+pubDate.getDate()+' '+MON3[pubDate.getMonth()]+'</button>');
  chips.push('<button class="datechip pick" onclick="openCal()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3.5v3M16 3.5v3"/></svg>Pick a date</button>');
  h+='<div class="publ">Due</div><div class="daterow">'+chips.join('')+'</div>';
  h+='<button class="sbtn blue" style="margin-top:16px" onclick="doPublish()"'+(pubSel?'':' disabled')+'>Publish to '+(pubSel||'…')+'</button>';
  document.getElementById('pubbody').innerHTML=h;
  var on=document.querySelector('#pubbody .datechip.on'), row=on&&on.parentNode; if(row) row.scrollLeft=Math.max(0,on.offsetLeft-row.clientWidth/2+on.offsetWidth/2);
}
function doPublish(){
  var a=aGet(pubId); if(!a||!pubSel)return;
  var nid=Math.max.apply(null,ASGS.map(function(x){return x.id;}))+1, c=pubSel;
  ASGS.push({id:nid,topic:a.topic,sub:a.sub,cls:c,type:a.type,st:'run',due:pubDue(),total:{'5A':32,'5B':30,'5C':31,'6A':34,'6B':36,'7A':33,'7B':30,'7C':28,'8A':35}[c]||30,sub_in:0,assessed:0,flags:0,pend:[]});
  a.to=a.to.filter(function(x){return x!==c;}); if(!a.to.length) ASGS.splice(ASGS.indexOf(a),1);
  closePublish(); toast('Published to '+c+' · due '+afmt(pubDue())); renderAssess();
}
/* custom date calendar */
var calM=null;
function openCal(){ var d=pubDue(); calM=new Date(d.getFullYear(),d.getMonth(),1); pubMode='cal'; renderPublish(); }
function closeCal(){ pubMode='pick'; renderPublish(); }
function calShift(n){ calM=new Date(calM.getFullYear(),calM.getMonth()+n,1); renderCal(); }
function renderCal(){
  var MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var first=calM.getDay(), days=new Date(calM.getFullYear(),calM.getMonth()+1,0).getDate();
  var min=ad(1); min.setHours(0,0,0,0); var sel=pubDue();
  var h='<div class="calhd"><button class="calnav" onclick="calShift(-1)">&#8249;</button><b>'+MN[calM.getMonth()]+' '+calM.getFullYear()+'</b><button class="calnav" onclick="calShift(1)">&#8250;</button></div>';
  h+='<div class="calgrid">'+['S','M','T','W','T','F','S'].map(function(x){return '<span class="caldow">'+x+'</span>';}).join('');
  for(var i=0;i<first;i++) h+='<span></span>';
  for(var d=1;d<=days;d++){
    var dt=new Date(calM.getFullYear(),calM.getMonth(),d); var dis=dt<min;
    var isSel=(dt.getTime()===new Date(sel.getFullYear(),sel.getMonth(),sel.getDate()).getTime());
    var isToday=(dt.getTime()===ATODAY.getTime());
    h+='<button class="calday'+(isSel?' on':'')+(isToday?' today':'')+'"'+(dis?' disabled':'')+' onclick="pickCal('+d+')">'+d+'</button>';
  }
  document.getElementById('pubbody').innerHTML=h+'</div>';
}
function pickCal(d){ pubDate=new Date(calM.getFullYear(),calM.getMonth(),d); pubDays=0; closeCal(); }

/* ---------------- bottom tabs ---------------- */
function _applyTab(name){
  curTab=name; var isDiary=(name==='diary');
  document.querySelector('.body').style.display=isDiary?'none':'';
  document.getElementById('diaryScreen').style.display=isDiary?'':'none';
  ['home','assess','insights'].forEach(function(t){ var el=document.getElementById('tab-'+t); if(el)el.style.display=(t===name)?'':'none'; });
  var as=document.querySelectorAll('.nav a'); as.forEach(function(a){a.classList.remove('on');});
  var order={home:0,assess:1,insights:2,diary:3}; if(as[order[name]])as[order[name]].classList.add('on');
  document.getElementById('homeFilters').style.display=(name==='home'||name==='assess'||isDiary)?'':'none';
  document.getElementById('insightsFilters').style.display=(name==='insights')?'':'none';
  document.querySelector('.header').classList.toggle('flush',isDiary);
  if(name==='home'){ document.querySelector('.body').scrollTop=0; showHero(); }
  if(name==='assess'){ document.querySelector('.body').scrollTop=0; renderAssess(); }
  if(isDiary){ if(!dReady){ dInit(); dReady=true; } else { dApplyFilter(); } }
  if(name==='insights'){ if(!iReady){ iInit(); iReady=true; } }
}
/* device-back from any sub-tab returns to Home (one history entry above Home) */
var navLevel=0;
function setTab(name){
  if(name==='home'){
    if(navLevel===1){ history.back(); return; }   // popstate applies Home
    _applyTab('home');
  } else {
    _applyTab(name);
    if(navLevel===0){ navLevel=1; try{history.pushState({tab:name},'');}catch(e){} }
    else { try{history.replaceState({tab:name},'');}catch(e){} }
  }
}
window.addEventListener('popstate',function(e){
  var t=(e.state&&e.state.tab)||'home'; navLevel=(t==='home')?0:1; _applyTab(t);
});

renderHero1();
showHero();
/* returning from the topic journey: restore the hero (Hero 2 for a class, else Hero 1) */
try{ var __hc=window.__HOMECLS; if(__hc){ var __chip=Array.prototype.slice.call(document.querySelectorAll('#clsrow .fchip')).filter(function(c){return c.textContent.trim()===__hc;})[0]; if(__chip) clickCls(__hc,__chip); window.__HOMECLS=null; } }catch(e){}
try{history.replaceState({tab:'home'},'');}catch(e){}
<\/script>

          <div class="frow" id="clsrow" data-dim="cls"><button class="fchip" data-label="Grade 5" onclick="clickCls('5',this)">Grade 5</button><button class="fchip" data-label="Grade 6" onclick="clickCls('6',this)">Grade 6</button><button class="fchip" data-label="Grade 7" onclick="clickCls('7',this)">Grade 7</button><button class="fchip" data-label="Grade 8" onclick="clickCls('8',this)">Grade 8</button></div>

        <div class="et" id="et">No topics found</div>

<script>
// Topics are prepared at GRADE level (independent of section 5A/5B/5C)
var SUBJ={'5':['EVS','Maths'],'6':['Maths','EVS'],'7':['Maths','Science'],'8':['Maths','Science']};
var CHAP={'5':{EVS:'Seeds & Plants',Maths:'Patterns'},'6':{Maths:'Fractions',EVS:'Environment'},'7':{Maths:'Integers',Science:'Acids & Bases'},'8':{Maths:'Mensuration',Science:'Force & Pressure'}};
// pending (not-yet-prepared) topics per GRADE/subject (deduped across sections)
/* topics that already have a generated deck, per GRADE/subject → open Topic Details */
var PREPARED={
 '5':{EVS:['Seeds & Germination','How Plants Grow','Parts of a Seed'],Maths:['Patterns']},
 '6':{Maths:['Fractions'],EVS:['Environment']},
 '7':{Maths:['Integers'],Science:['Acids & Bases']},
 '8':{Maths:['Mensuration'],Science:['Force & Pressure']}
};
var TODO={
 '5':{EVS:['Types of Seeds','Parts of a Plant','Plants Around Us'],Maths:['Subtraction','Multiplication']},
 '6':{Maths:['Decimals','Geometry','Data Handling'],EVS:['Air Around Us','Plants']},
 '7':{Maths:['Algebra','Ratio','Geometry','Fractions','Perimeter','Data'],Science:['Physical & Chemical Changes','Motion','Light','Electricity','Acids & Bases','Weather']},
 '8':{Maths:['Algebra','Factorisation','Graphs','Geometry'],Science:['Friction','Sound','Light','Chemical Effects','Metals']}
};
function iPlus(){return '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';}
function iPlay(){return '<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';}
function prow(r){
  return '<div class="lrow" onclick="pick(this,'+(r.ready?1:0)+')"><div class="lmain"><div class="ltitle">'+r.t+'</div><div class="lmetarow"><span class="lchip">'+r.chip+'</span></div></div><button class="libtn '+(r.ready?'play':'prep')+'">'+(r.ready?iPlay():iPlus())+'</button></div>';
}
function pick(el,ready){ el.style.background='#EFF4FE'; setTimeout(function(){ if(ready) parent.go('build','details'); else parent.go('build'); },130); }
function clearQ(){ var q=document.getElementById('q'); q.value=''; q.focus(); renderList(); }
function renderList(){
  var q=(document.getElementById('q').value||'').trim().toLowerCase();
  var rows=[];
  document.querySelector('.search').classList.toggle('has',!!q);
  for(var cls in TODO){ if(curCls&&cls!==curCls)continue;
    for(var sub in TODO[cls]){ if(curSub&&sub!==curSub)continue;
      var chap=(CHAP[cls]&&CHAP[cls][sub])||'';
      var chip='Grade '+cls+' · '+sub+(chap?' · '+chap:'');
      ((PREPARED[cls]||{})[sub]||[]).forEach(function(t){ if(q&&(t+' '+chip).toLowerCase().indexOf(q)<0)return; rows.push({t:t,chip:chip,ready:true}); });
      TODO[cls][sub].forEach(function(t){ if(q&&(t+' '+chip).toLowerCase().indexOf(q)<0)return; rows.push({t:t,chip:chip,ready:false}); });
    }
  }
  var el=document.getElementById('list');
  if(rows.length){
    el.innerHTML='<div class="listcard">'+rows.map(prow).join('')+'</div>';
    document.getElementById('empty').style.display='none';
  } else {
    el.innerHTML='';
    document.getElementById('empty').style.display='';
    document.getElementById('et').textContent=q?'No topics match "'+document.getElementById('q').value+'"':'No topics here';
    document.getElementById('es').textContent=q?'Try another term or clear the filter.':'Pick another grade or subject.';
  }
}

/* ---------------- filter bar (shared logic) ---------------- */
var curCls=null,curSub=null;
var XICO='<svg class="xico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function removeSubinline(){var w=document.getElementById('subinline');if(w)w.remove();}
function buildSubinline(cls,afterEl){
  removeSubinline(); var subs=SUBJ[cls]||[]; if(subs.length<2)return;
  var wrap=document.createElement('span');wrap.className='subinline';wrap.id='subinline';
  var div=document.createElement('span');div.className='subdiv';wrap.appendChild(div);
  subs.forEach(function(s){var b=document.createElement('button');b.className='subchip';b.setAttribute('data-sub',s);b.textContent=s;b.onclick=function(){clickSub(s,b);};wrap.appendChild(b);});
  afterEl.parentNode.insertBefore(wrap,afterEl.nextSibling);
}
function resetChips(){document.querySelectorAll('#clsrow .fchip').forEach(function(c){c.style.display='';c.classList.remove('act');c.innerHTML=c.getAttribute('data-label')||c.textContent.trim();});}
function clickCls(val,el){
  if(curCls===val){clearCls();return;}
  curCls=val;curSub=null;resetChips();
  document.querySelectorAll('#clsrow .fchip').forEach(function(c){if(c!==el)c.style.display='none';});
  el.classList.add('act');el.innerHTML=XICO+(el.getAttribute('data-label')||val);buildSubinline(val,el);
  renderList();
}
function clickSub(val,el){
  if(curSub===val){curSub=null;el.classList.remove('act');el.innerHTML=val;}
  else{curSub=val;document.querySelectorAll('#subinline .subchip').forEach(function(c){c.classList.remove('act');c.innerHTML=c.getAttribute('data-sub');});el.classList.add('act');el.innerHTML=XICO+val;}
  renderList();
}
function clearCls(){curCls=null;curSub=null;resetChips();removeSubinline();renderList();}

document.getElementById('q').addEventListener('input',renderList);

/* preselect from URL hash: #5A or #5A-EVS (carried from a filtered Home) */
function preselect(){
  var h=decodeURIComponent((location.hash||'').replace('#','')); if(!h)return;
  var p=h.split('-'); var cls=p[0];
  var chip=[].slice.call(document.querySelectorAll('#clsrow .fchip')).filter(function(c){return c.textContent.trim().replace('Grade ','')===cls;})[0];
  if(!chip)return; clickCls(cls,chip);
  if(p[1]){ var sc=[].slice.call(document.querySelectorAll('#subinline .subchip')).filter(function(c){return c.getAttribute('data-sub')===p[1];})[0]; if(sc) clickSub(p[1],sc); }
}
renderList();
preselect();
<\/script>
</body>

</script>

function renderSlide(sl){

    inner=kick+'<div class="heroart">'+(ART[sl.art]||'')+'</div><div class="herotx"><div class="rh">'+H+'</div>'+(S?'<div class="rsub">'+S+'</div>':'')+'</div>';

  } else if(sl.layout==='talk'){
    inner=kick+'<div class="bubble" style="right:24px;top:52px">I think… sun?</div><div class="bubble" style="right:60px;top:98px;border-radius:16px 16px 4px 16px">…and water!</div><div class="herotx"><div class="rh">'+H+'</div><div class="rsub">'+S+'</div></div>';
  } else if(sl.layout==='needs'){
    var rows=[['water','Water','softens the hard coat','#6FB0FF'],['air','Air','lets the seed breathe','#4FD0CC'],['warm','Warmth','wakes it from sleep','#F6BE5A']].map(function(c){
      return '<div class="ncell"><span class="ni" style="background:'+hexA(c[3],.16)+';color:'+c[3]+'">'+needIcon(c[0])+'</span><div class="ntx"><b>'+c[1]+'</b><span>'+c[2]+'</span></div></div>';

      +'<div class="ptx"><div class="rh">'+H+'</div>'

    h+=ACFG.written.map(function(w,i){ return '<div class="wcard"><span class="lon">'+(i+1)+'</span><textarea placeholder="e.g. Draw a seed and label its three parts." oninput="setWritten('+i+',this.value)">'+w+'</textarea>'+(ACFG.written.length>1?'<button class="qswap" title="Remove" onclick="rmWritten('+i+')">&times;</button>':'')+'</div>'; }).join('');
    h+='<div class="changeplan" onclick="addWritten()"><span>+ Add another question</span></div>';
  } else {
    h+='<div class="divlabel"><span class="l">'+(ACFG.type==='Activity'?'Activities':'Questions')+'</span><span class="r"></span><span class="hint">Tap &#8644; to swap one</span></div>';
    h+=ACFG.items.map(function(it,i){ return qCard(it,i,false); }).join('');
    h+='<div class="changeplan" onclick="openAdd()"><span>+ Add '+(ACFG.type==='Activity'?'an activity':'a question')+'</span></div>';
  }
  host.innerHTML=h;
  var cnt=(ACFG.type==='Custom')?ACFG.written.filter(function(w){return w.trim();}).length:ACFG.items.length;
  document.getElementById('foot').innerHTML='<div class="footx"><div class="foott">'+ACFG.type+' <span class="fbadge">'+cnt+'</span></div><div class="foots">'+(hasDiff()?ACFG.diff+' · ':'')+'due date set on publish</div></div>'
    +'<button class="buildbtn wide" id="asggen" onclick="makeAssign()"'+(cnt?'':' disabled')+'>Generate <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>';
}
/* swap sheet */
var swapIdx=0, swapMode='swap';
function openAdd(){
  if(ACFG.type==='Quiz'&&ACFG.items.length>=AMAX){ toast(AMAX+' questions is the most a quiz can hold for now.'); return; }
  swapMode='add'; openSwap(-1);
}
function openSwap(i){
  if(i>=0) swapMode='swap';
  swapIdx=i; var pool=APOOL[ACFG.type]||[], used=ACFG.items;
  var alts=pool.filter(function(x){return used.indexOf(x)<0;});
  var noun=(ACFG.type==='Activity')?'activity':'question';
  document.getElementById('swapeye').textContent=(swapMode==='add')?'Add '+(ACFG.type==='Activity'?'an':'a')+' '+noun:'Replace '+noun+' '+(i+1);
  document.getElementById('swaptt').textContent=(swapMode==='add')?'Pick one to add':'Pick a replacement';
  document.getElementById('swaplist').innerHTML=alts.length?alts.map(function(x){ var k=pool.indexOf(x); return '<div class="lo swapit" onclick="doSwap('+k+')"><div class="lotx"><div class="lot">'+x.q+'</div><div class="swmeta"><span class="qdiff '+x.d+'">'+{easy:'Easy',bal:'Balanced',hard:'Hard'}[x.d]+'</span>'+(x.o?'<span class="loby">Answer: '+x.o[x.a]+'</span>':'')+'</div></div></div>'; }).join(''):'<div class="cfgs">No more alternatives for this topic yet.</div>';
  document.getElementById('swapscrim').classList.add('open');
}
function doSwap(k){
  var it=APOOL[ACFG.type][k];
  if(swapMode==='add'){ ACFG.items.push(it); if(ACFG.type==='Quiz') ACFG.n=ACFG.items.length; }
  else ACFG.items[swapIdx]=it;
  closeSwap(); renderAssign_page();
}
function closeSwap(){ document.getElementById('swapscrim').classList.remove('open'); }
function makeAssign(){
  var items=ACFG.type==='Custom'?ACFG.written.filter(function(w){return w.trim();}).map(function(w){return {q:w};}):ACFG.items.slice();
  if(!items.length){ return; }
  var parts=[]; if(hasDiff()) parts.push(ACFG.diff); parts.push(items.length+(ACFG.type==='Activity'?' activit'+(items.length>1?'ies':'y'):' question'+(items.length>1?'s':'')));
  ASSIGN='working'; showView('deck');
  setTimeout(function(){ ASSIGN={type:ACFG.type,q:items.length,items:items,diff:hasDiff()?ACFG.diff:null,summary:parts.join(' · '),cls:null}; renderAssign(); },1400);
}
function classRow(c){
  var tick='<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 6"/></svg>';
  if(c.status==='done') return '<span class="cchip done"><span style="color:var(--green)">'+tick+'</span>'+c.id+'<span class="cd">'+(c.when||'Taught').replace('Taught ','')+'</span></span>';
  if(c.status==='live') return '<span class="cchip live"><span class="rddot"></span>'+c.id+'<span class="cd" id="liveTimer">'+fmt(classSecs)+'</span></span>';
  return '<span class="cchip">'+c.id+'<span class="cd">Ready</span></span>';
}
function renderStatus(){ var el=document.getElementById('statusBody'); if(el) el.innerHTML=CLASSES.map(classRow).join(''); }
function selectClass(id){ if(classRunning)return; selClass=id; renderStatus(); setDeckFoot(); }
function selectSlide(i){
  curSlide=i;
  var ms=document.getElementById('mainStage'); if(ms) ms.innerHTML=mount(deckSlides[i].sl);
  var fb=document.getElementById('filmbar'); if(fb){ var ts=fb.querySelectorAll('.fthumb'); for(var k=0;k<ts.length;k++) ts[k].className='fthumb'+(k===i?' on':''); }
  requestAnimationFrame(fit);
}
function startTick(){
  if(classTick) clearInterval(classTick);
  classTick=setInterval(function(){
    classSecs++; var tb=document.getElementById('tbtimer'); if(tb)tb.textContent=fmt(classSecs);
  },1000);
}
/* pre-flight: pick the class */
function openPreflight(){ if(!selClass) selClass=firstReady(); renderPfClasses(); document.getElementById('pfscrim').classList.add('open'); }
function closePreflight(){ document.getElementById('pfscrim').classList.remove('open'); }
function renderPfClasses(){
  document.getElementById('pfclasses').innerHTML=CLASSES.map(function(c){
    var sel=(selClass===c.id);
    var stat=(c.status==='done')?'<span class="pfstat done">Completed</span>':'<span class="pfstat ready">Ready</span>';
    var q=(c.status==='done')?(c.when||'Completed')+' · teach again':'Ready to teach';
    return '<div class="pfcls'+(sel?' on':'')+'" onclick="selectPfClass(\''+c.id+'\')"><span class="pfradio"></span><div class="pfx"><div class="pfn">Class '+c.id+'</div><div class="pfq">'+q+'</div></div>'+stat+'</div>';
  }).join('');
}
function selectPfClass(id){ selClass=id; renderPfClasses(); }
/* full-page teach — light, swipeable carousel (slide + notes per panel) + filmstrip */
var PAUSE_ICO='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
var PLAY_ICO='<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
function startTeach(){
  if(!selClass) return; closePreflight();
  var c=CLASSES.filter(function(x){return x.id===selClass;})[0]; if(c)c.status='live';
  classRunning=true; teachPaused=false; classSecs=0; curSlide=0;
  document.getElementById('tbclass').textContent='Class '+selClass;
  document.getElementById('tbpause').innerHTML=PAUSE_ICO;
  var t=document.getElementById('teach'); t.classList.remove('paused'); t.classList.add('show');
  document.getElementById('tbtimer').textContent='00:00';
  renderTeach(); startTick();
}
function renderTeach(){
  var car=document.getElementById('tcar');
  car.innerHTML=deckSlides.map(function(it){
    return '<div class="tpanel">'+mount(it.sl)+'<div class="tnotes"><div class="tnl">How to teach this slide</div><div class="tnt">'+(it.sl.note||'')+'</div></div></div>';
  }).join('');
  var g=0, film='';
  STEPS.forEach(function(s){
    film+='<span class="filmtag"><b>'+s.n+'</b> '+s.name+'</span>';
    slidesOf(s).forEach(function(sl){ var gi=g++; film+='<div class="tfthumb'+(gi===curSlide?' on':'')+'" onclick="teachGo('+gi+')">'+mount(sl)+'</div>'; });
  });
  document.getElementById('tfilm').innerHTML=film;
  requestAnimationFrame(function(){ fit(); var w=car.clientWidth; car.scrollLeft=curSlide*w; syncFilm(); });
}
function teachGo(i){ var car=document.getElementById('tcar'); car.scrollTo({left:i*car.clientWidth,behavior:'smooth'}); }
function syncFilm(){
  var car=document.getElementById('tcar'); if(!car)return; var w=car.clientWidth; var idx=w?Math.round(car.scrollLeft/w):0; curSlide=idx;
  var thumbs=document.querySelectorAll('#tfilm .tfthumb');
  for(var k=0;k<thumbs.length;k++) thumbs[k].classList.toggle('on',k===idx);
  var cur=thumbs[idx]; if(cur){ var f=document.getElementById('tfilm'); f.scrollLeft=cur.offsetLeft-(f.clientWidth-cur.clientWidth)/2; }
}
function togglePause(){
  teachPaused=!teachPaused;
  var t=document.getElementById('teach'), btn=document.getElementById('tbpause');
  if(teachPaused){ if(classTick){clearInterval(classTick);classTick=null;} t.classList.add('paused'); btn.innerHTML=PLAY_ICO; btn.title='Resume'; }
  else { startTick(); t.classList.remove('paused'); btn.innerHTML=PAUSE_ICO; btn.title='Pause'; }
}
function endClass(){
  var c=CLASSES.filter(function(x){return x.id===selClass;})[0]; if(c){ c.status='done'; c.when='Taught just now'; }
  classRunning=false; teachPaused=false; if(classTick){clearInterval(classTick);classTick=null;}
  document.getElementById('teach').classList.remove('show','paused');
  stopCast();
  selClass=firstReady(); curSlide=0; renderDeck(); setDeckFoot();
}
/* cast to a screen */
function openCast(){ document.getElementById('castdlg').classList.add('open'); }
function closeCast(){ document.getElementById('castdlg').classList.remove('open'); }
function selectDevice(name){ closeCast(); document.getElementById('tlivedev').textContent=name; document.getElementById('tliveband').style.display='flex'; }
function stopCast(){ var b=document.getElementById('tliveband'); if(b)b.style.display='none'; }

/* ---------------- bottom sheet preview + notes ---------------- */
var vslides=[], vmode='style';
function setNote(idx){
  var it=vslides[idx]; if(!it)return;
  document.getElementById('snotes').innerHTML='<div class="nl"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h11"/></svg>How to teach this slide</div><div class="nt">'+(it.sl.note||'')+'</div>';
  document.getElementById('snotes').scrollTop=0;
}
function updateDots(){
  var car=document.getElementById('pcar'); var w=car.clientWidth+14; var idx=w?Math.round(car.scrollLeft/w):0;
  var dots=document.getElementById('pdotrow').children;
  for(var k=0;k<dots.length;k++) dots[k].className=(k===idx?'on':'');
  setNote(idx); renderPZ(idx);
}
var PZOPTS=[['simpler','Simpler'],['shorter','Shorter'],['local','Local example'],['hindi','हिंदी']];
function renderPZ(idx){
  var sl=vslides[idx]&&vslides[idx].sl; if(!sl)return;
  var chips=PZOPTS.filter(function(o){return sl.alt&&sl.alt[o[0]];}).map(function(o){
    var on=sl._k===o[0];
    return '<button class="pzchip'+(on?' on':'')+'" onclick="applyTransform('+idx+',\''+o[0]+'\')">'+(on?'&#10003; ':'')+o[1]+'</button>';
  }).join('');
  document.getElementById('pzchips').innerHTML=chips||'<span style="font-size:11.5px;color:var(--muted);font-weight:600">No quick edits for this slide.</span>';
}
function applyTransform(idx,key){
  var sl=vslides[idx].sl; var panel=document.querySelectorAll('.pslide')[idx]; if(!panel)return;
  var off=(sl._k===key);
  var ov=document.createElement('div'); ov.className='pworking'; ov.innerHTML='<span class="spark">&#10022;</span> '+(off?'Reverting…':'Personalising…');
  panel.appendChild(ov);
  setTimeout(function(){
    if(off){ sl._ov=null; sl._k=null; } else { sl._ov=sl.alt[key]; sl._k=key; }
    panel.innerHTML=mount(sl); fit(); renderPZ(idx);
    if(curView==='deck') renderDeck(); // reflect the change in the built-deck thumbnails
  },560);
}
function paintSheet(startIdx){
  var car=document.getElementById('pcar');
  car.innerHTML=vslides.map(function(it){ return '<div class="pslide">'+mount(it.sl)+'</div>'; }).join('');
  var dots=''; for(var k=0;k<vslides.length;k++) dots+='<i></i>'; document.getElementById('pdotrow').innerHTML=dots;
  if(vmode==='deck'){
    var eye=document.getElementById('sheye'); eye.textContent=classRunning?'Class in progress':'Full presentation'; eye.style.color=classRunning?'#B9761E':'var(--navy)';
    document.getElementById('shtt').textContent='Seeds & Germination · '+vslides.length+' slides';
    if(classRunning){
      document.getElementById('sheetfoot').innerHTML='<span class="ptimerbig" id="ptimer">'+fmt(classSecs)+'</span><button class="sbtn ghost" onclick="endClass()">End class</button><button class="sbtn" onclick="closeViewer()"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M9 6v12l9-6z"/></svg> Teaching</button>';
    } else {
      document.getElementById('sheetfoot').innerHTML='<span class="note">Swipe to review each slide</span><button class="sbtn ghost" onclick="closeViewer()">Close</button><button class="sbtn" onclick="runClass()"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg> Run the class</button>';
    }
  } else {
    var s=vslides[0].s, eye=document.getElementById('sheye'); eye.textContent=s.name; eye.style.color=ACCENT;
    document.getElementById('shtt').textContent=state[s.key]+' · '+vslides.length+' slide'+(vslides.length>1?'s':'');
    document.getElementById('sheetfoot').innerHTML='<span class="note">Swipe · notes update per slide</span><button class="sbtn ghost" onclick="closeViewer()">Close</button>';
  }
  var pz=document.querySelector('.pzrow'); if(pz) pz.style.display=(vmode==='deck')?'none':'';
  document.getElementById('scrim').classList.add('open');
  requestAnimationFrame(function(){ fit(); var w=car.clientWidth+14; car.scrollLeft=(startIdx||0)*w; setNote(startIdx||0); renderPZ(startIdx||0);
    var d=document.getElementById('pdotrow').children; for(var k=0;k<d.length;k++) d[k].className=(k===(startIdx||0)?'on':''); });
}
function openPreview(key,i){ var s=stepOf(key); vslides=slidesOf(s).map(function(sl){return {s:s,sl:sl};}); vmode='style'; paintSheet(i||0); }
function openDeck(startIdx){ vslides=[]; STEPS.forEach(function(s){ slidesOf(s).forEach(function(sl){ vslides.push({s:s,sl:sl}); }); }); vmode='deck'; paintSheet(startIdx||0); }
function closeViewer(){ document.getElementById('scrim').classList.remove('open'); }
document.getElementById('pcar').addEventListener('scroll',updateDots);
(function(){ var tc=document.getElementById('tcar'); var raf=null; tc.addEventListener('scroll',function(){ if(raf)return; raf=requestAnimationFrame(function(){raf=null;syncFilm();}); }); })();
window.addEventListener('resize',fit);
var ENTRY=((typeof window!=='undefined'&&window.__INITVIEW==='details')||location.hash==='#details')?'details':'prepare';
/* back: from the topic-details (deck) page -> Home; from the build (design) page -> Prepare Topic */
function topicBack(){ if(curView==='assign'){ showView('deck'); } else if(curView==='deck'){ parent.go('home'); } else { parent.go('prepare'); } }
showView(ENTRY==='details'?'deck':'design');

<script>
/* ---- Petrilab Classroom - single editable file ----
   Each screen is a <script type="text/html" id="s-NAME"> block above.
   Edit the HTML inside a block directly, save, reload. NO rebuild step.
   ONE rule: to type a literal closing script tag inside a block,
   escape it as <\/script> (backslash) so it does not end the block early.
   Cross-screen nav: parent.go('home'|'prepare'|'build', optionalView). */
var ENDTAG='<'+'/script>';
function raw(id){return document.getElementById(id).textContent.replace(/<\\\/script>/g,ENDTAG);}
var SCREENS={home:'s-home',prepare:'s-prepare',build:'s-build'};
var ORIGIN=null; window.setOrigin=function(o){ORIGIN=o||null;};
function go(name,view){
  if(!SCREENS[name])return;
  var html=raw(SCREENS[name]),inject='';
  if(view)inject+='window.__INITVIEW='+JSON.stringify(view)+';';
  if(name==='home'&&ORIGIN)inject+='window.__HOMECLS='+JSON.stringify(ORIGIN)+';';
  if(inject)html=html.replace('</head>','<'+'script>'+inject+ENDTAG+'</head>');
  document.getElementById('screen').srcdoc=html;
  try{location.hash=name+(view?(':'+view):'');}catch(e){}
}
window.go=go;
var h=(location.hash||'#home').slice(1),parts=h.split(':'),nm=(parts[0] in SCREENS)?parts[0]:'home';
go(nm,parts[1]);
</script></body></html>
