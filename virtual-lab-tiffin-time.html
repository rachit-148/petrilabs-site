<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FAFBFC">
<title>Virtual Lab · Tiffin Time</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFBFC;--card:#fff;--ink:#22303C;--mute:#5F6F7E;--line:#E2E7EC;--soft:#F1F4F7;--accent:#D95926;--ok:#199E70;--bad:#C0392B;
  --energy:#E8A317;--grow:#3987E5;--prot:#199E70;--font:'Nunito',"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;margin:0}
button:focus-visible{outline:3px solid #8FB8F0;outline-offset:2px}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:44px}
.top .k{font-size:12px;color:var(--mute)}
.top .t{font-size:15px;font-weight:800}
.top .sp{flex:1}
.tbtn{font-size:12px;color:var(--mute);padding:6px 10px;border-radius:999px;background:var(--soft)}
.tbtn.on{background:var(--ink);color:#fff}
.stagewrap{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;padding:0 8px}
#stage{width:100%;height:100%;display:block;touch-action:none}
.spk{position:absolute;top:8px;right:16px;width:44px;height:44px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(20,30,40,.15);display:grid;place-items:center}
.spk svg{width:24px;height:24px}
.spk.talking{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.nav{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 16px 12px;position:relative;min-height:72px}
.dots{display:flex;gap:10px}
.dots i{width:12px;height:12px;border-radius:50%;background:#D9DEE4;display:block}
.dots i.done{background:var(--ok)}.dots i.on{background:var(--ink);transform:scale(1.25)}
.go{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:60px;height:60px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 4px 12px rgba(217,89,38,.35);transition:opacity .3s,transform .3s}
.go svg{width:28px;height:28px}
.go[disabled]{opacity:.25;box-shadow:none;cursor:default}
.go.ready{animation:nudge 1.2s infinite}
@keyframes nudge{50%{transform:translateY(-50%) scale(1.08)}}
.back{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:var(--soft);display:grid;place-items:center}
.back svg{width:20px;height:20px}

/* start screen */
#start{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;padding:20px}
#start svg{width:min(70vw,52vh);height:auto}
#start h1{margin:0;font-size:clamp(22px,4vw,34px);font-weight:800}
#start p{margin:0;color:var(--mute);font-size:14px;text-align:center;max-width:420px}
.play{width:96px;height:96px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:0 6px 18px rgba(217,89,38,.35);margin-top:8px}
.play svg{width:44px;height:44px;margin-left:6px}

/* teacher panel */
.panel{position:absolute;inset:0;background:rgba(20,30,40,.35);z-index:10;display:flex;justify-content:flex-end}
.panel .in{width:min(420px,100%);height:100%;background:#fff;overflow:auto;padding:16px 18px 24px;font-weight:600;font-size:14px;line-height:1.4}
.panel h2{margin:0 0 4px;font-size:18px;font-weight:800}
.panel h3{margin:16px 0 6px;font-size:14px;font-weight:800}
.panel p{margin:0 0 8px}
.panel ul{margin:0;padding-left:18px}
.panel li{margin:3px 0}
.panel .x{float:right;width:34px;height:34px;border-radius:50%;background:var(--soft);font-size:18px}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:6px}
.sc .d{display:flex;gap:4px}.sc .d i{width:10px;height:10px;border-radius:50%;background:#D9DEE4;display:block}
.sc .d i.y{background:var(--ok)}.sc .d i.n{background:var(--bad)}
.sc button{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--soft)}
code{background:var(--soft);border-radius:6px;padding:1px 5px;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.row button{padding:8px 14px;border-radius:999px;background:var(--soft);font-weight:800}
.row button.p{background:var(--accent);color:#fff}

/* svg motion */
.drag{cursor:grab;transition:transform .28s cubic-bezier(.2,.8,.3,1.2)}
.drag.lift{transition:none;filter:drop-shadow(0 8px 10px rgba(20,30,40,.3))}
.drag.gone{transition:transform .3s,opacity .3s;opacity:0}
.bounce{animation:bounce .55s ease-in-out 3;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bounce{50%{transform:translateY(-16px)}}
.flex{animation:flex .6s ease-in-out 2;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flex{50%{transform:scaleY(1.06)}}
.shieldp{animation:shieldp .7s ease-in-out 3;transform-box:fill-box;transform-origin:center}
@keyframes shieldp{50%{transform:scale(1.06);opacity:1}}
.pop{animation:pop .5s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(.2);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.puff{animation:puff .9s ease-out both;transform-box:fill-box;transform-origin:center}
@keyframes puff{to{opacity:0;transform:translateY(-30px) scale(1.5)}}
.wob{animation:wob .5s ease-in-out;transform-box:fill-box;transform-origin:center}
@keyframes wob{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.blink{animation:blink 1s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.fadein{animation:pop .5s ease-out both}
.conf{animation:conf 1.6s ease-in both;transform-box:fill-box}
@keyframes conf{to{transform:translateY(520px) rotate(300deg);opacity:0}}
.germ{animation:drift 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes drift{50%{transform:translate(6px,-6px)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <span class="t">Tiffin Time</span><span class="k">· Foundational · C-1.1</span><span class="sp"></span>
    <button class="tbtn" id="teacherBtn">Teacher</button>
  </div>
  <div class="stagewrap">
    <svg id="stage" viewBox="0 0 700 700" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>
    <button class="spk" id="spk" aria-label="Hear it again"><svg viewBox="0 0 24 24" fill="none" stroke="#22303C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10v4h4l5 4V6L8 10z" fill="#22303C"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
    <div id="start">
      <svg viewBox="0 0 320 300" xmlns="http://www.w3.org/2000/svg" id="startArt"></svg>
      <h1>Tiffin Time</h1>
      <p>Tap the orange button. Anu will tell you what to do.</p>
      <button class="play" id="playBtn" aria-label="Start"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="#fff"/></svg></button>
    </div>
  </div>
  <div class="nav">
    <button class="back" id="backBtn" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#22303C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="dots" id="dots"></div>
    <button class="go" id="goBtn" aria-label="Next" disabled><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="panel hidden" id="panel"><div class="in" id="panelIn"></div></div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function bowl(fill,extra){
  return `<ellipse cx="32" cy="29" rx="22" ry="8" fill="${fill}"/>${extra||''}<path d="M10 30h44l-5 22H15z" fill="#CFD6DE" stroke="#9AA6B2" stroke-width="1.5"/><path d="M10 30h44" stroke="#9AA6B2" stroke-width="1.5"/>`;
}
function fly(x,y){return `<g><circle cx="${x}" cy="${y}" r="2.2" fill="#222"/><ellipse cx="${x-2.6}" cy="${y-2}" rx="2.6" ry="1.4" fill="#9AB6D6" opacity=".85"/><ellipse cx="${x+2.6}" cy="${y-2}" rx="2.6" ry="1.4" fill="#9AB6D6" opacity=".85"/></g>`;}
function foodSVG(f,bad){
  let s='';
  const sour=bad==='sour';
  switch(f){
    case 'roti': s=`<circle cx="32" cy="32" r="24" fill="#E9C994" stroke="#C69C5A" stroke-width="2"/><circle cx="24" cy="26" r="3" fill="#D5AC6A"/><circle cx="38" cy="38" r="4" fill="#D5AC6A"/><circle cx="41" cy="22" r="2.5" fill="#D5AC6A"/><circle cx="22" cy="41" r="2" fill="#D5AC6A"/>`;break;
    case 'rice': s=bowl('#F4F1E6',`<ellipse cx="32" cy="24" rx="16" ry="8" fill="#FFFDF7" stroke="#E4DCC6"/><g fill="#EFE7D0"><circle cx="24" cy="22" r="1.4"/><circle cx="34" cy="19" r="1.4"/><circle cx="40" cy="24" r="1.4"/><circle cx="30" cy="27" r="1.4"/></g>`);break;
    case 'aloo': s=bowl('#E0A030',`<g fill="#F2C462" stroke="#C88A20" stroke-width="1"><rect x="20" y="22" width="9" height="8" rx="2"/><rect x="32" y="20" width="9" height="8" rx="2"/><rect x="27" y="14" width="9" height="8" rx="2"/></g>`);break;
    case 'bread': s=`<path d="M14 26a9 9 0 0 1 9-9h18a9 9 0 0 1 9 9v26H14z" fill="#E9C48E" stroke="#C69C5A" stroke-width="2"/><path d="M19 28h26v20H19z" fill="#F7E8C8"/>`;break;
    case 'dal': s=bowl('#F2C230',`<g fill="#D9A31A"><circle cx="24" cy="25" r="1.6"/><circle cx="36" cy="23" r="1.6"/><circle cx="42" cy="28" r="1.6"/></g><path d="M30 20c4-6 12-4 12 2" stroke="#3E9A45" stroke-width="2" fill="none"/>`);break;
    case 'milk': s=`<path d="M19 10h26l-3 44H22z" fill="#EEF2F5" stroke="#9AA6B2" stroke-width="1.5"/><path d="M22 22h20l-2 30H24z" fill="${sour?'#EFE6B8':'#FFFFFF'}"/>${sour?'<path d="M26 8c2-4-2-6 0-10M32 8c2-4-2-6 0-10M38 8c2-4-2-6 0-10" transform="translate(0,6)" stroke="#8FB56A" stroke-width="2" fill="none" stroke-linecap="round"/>':''}`;break;
    case 'egg': s=`<ellipse cx="32" cy="34" rx="16" ry="20" fill="#FFF8EC" stroke="#E0D5BE" stroke-width="1.5"/><ellipse cx="32" cy="36" rx="8" ry="9" fill="#F5C542"/>`;break;
    case 'paneer': s=bowl('#4E9A3C',`<g fill="#FFF9EE" stroke="#D8CDB6" stroke-width="1"><rect x="18" y="20" width="11" height="9" rx="2"/><rect x="33" y="19" width="11" height="9" rx="2"/><rect x="26" y="12" width="11" height="9" rx="2"/></g>`);break;
    case 'banana': s=`<path d="M12 18C13 40 27 53 47 51C50 55 44 59 36 59C18 57 7 40 12 18Z" fill="#F4D03F" stroke="#C9A81E" stroke-width="2"/><path d="M12 18l-2-5" stroke="#6B4A2B" stroke-width="3" stroke-linecap="round"/>`;break;
    case 'apple': s=`<circle cx="32" cy="36" r="20" fill="#E0412E"/><path d="M32 17v-7" stroke="#6B4A2B" stroke-width="3" stroke-linecap="round"/><path d="M33 14c6-6 12-4 12 0-4 3-9 2-12 0z" fill="#3E9A45"/>`;break;
    case 'sabzi': s=bowl('#4E9A3C',`<g fill="#3A7A2C"><circle cx="22" cy="26" r="2.5"/><circle cx="34" cy="22" r="2.5"/><circle cx="42" cy="27" r="2.5"/></g><circle cx="29" cy="20" r="2" fill="#F08A24"/>`);break;
    case 'carrot': s=`<path d="M22 20l10 38 10-38z" fill="#F08A24"/><path d="M27 34h10M25 26h14" stroke="#D9701C" stroke-width="1.5"/><path d="M32 20c-6-2-8-8-4-12M32 20c0-6 4-10 9-10M32 20c6-2 10-2 12 2" stroke="#3E9A45" stroke-width="3" fill="none" stroke-linecap="round"/>`;break;
    case 'chips': s=`<rect x="16" y="10" width="32" height="46" rx="4" fill="#3B7DD8"/><path d="M20 12l6 3h12l6-3" fill="none" stroke="#2A5FA8" stroke-width="2"/><ellipse cx="32" cy="34" rx="11" ry="9" fill="#F5C542"/><ellipse cx="32" cy="34" rx="6" ry="4" fill="#E8A317"/>`;break;
    case 'ladoo': s=`<circle cx="32" cy="34" r="18" fill="#F0A030"/><g fill="#D98A1A"><circle cx="24" cy="30" r="2"/><circle cx="36" cy="26" r="2"/><circle cx="40" cy="40" r="2"/><circle cx="28" cy="42" r="2"/></g><ellipse cx="33" cy="34" rx="3" ry="1.8" fill="#3E9A45"/>`;break;
    case 'cola': s=`<path d="M24 8h16v8l5 7v31H19V23l5-7z" fill="#5A2A12"/><rect x="24" y="8" width="16" height="4" fill="#D33"/><rect x="21" y="30" width="22" height="11" fill="#D33"/>`;break;
  }
  if(bad==='floor') s=`<path d="M4 58h56" stroke="#8B6B4A" stroke-width="3" stroke-linecap="round"/>`+s+`<g fill="#7A5A3A" opacity=".8"><circle cx="20" cy="30" r="1.6"/><circle cx="40" cy="26" r="1.6"/><circle cx="30" cy="44" r="1.6"/><circle cx="44" cy="42" r="1.6"/></g><g fill="#9AA6B2"><circle cx="8" cy="52" r="1.5"/><circle cx="56" cy="50" r="1.5"/><circle cx="14" cy="46" r="1.2"/></g>`;
  if(bad==='flies') s+=fly(18,12)+fly(48,16)+fly(40,6)+`<path d="M18 12c8-8 22-8 30 4" stroke="#222" stroke-width="1" stroke-dasharray="2 2" fill="none"/>`;
  if(bad==='mould') s+=`<g><circle cx="24" cy="36" r="5" fill="#6E8F5A"/><circle cx="30" cy="30" r="4" fill="#9DB48A"/><circle cx="38" cy="40" r="5" fill="#6E8F5A"/><circle cx="42" cy="34" r="3" fill="#B7C7A5"/></g>`;
  if(bad==='rotten') s+=`<g fill="#6B4A2B" opacity=".9"><ellipse cx="${f==='banana'?22:30}" cy="${f==='banana'?42:42}" rx="5" ry="3.5"/><ellipse cx="${f==='banana'?34:40}" cy="${f==='banana'?51:34}" rx="5" ry="3"/><ellipse cx="${f==='banana'?44:22}" cy="${f==='banana'?54:30}" rx="3" ry="2.5"/></g>`+fly(50,14);
  return s;
}
function foodIcon(f,bad,attrs){return `<svg viewBox="0 0 64 64" ${attrs||''} xmlns="${NS}">${foodSVG(f,bad)}</svg>`;}

/* ---------------- character ---------------- */
// Anu, drawn around (0,0) at her feet, ~250 tall at scale 1
function anu(o){
  o=o||{};const mood=o.mood||'smile',s=o.scale||1;
  const mouth={smile:'M-11 -190q11 11 22 0',big:'M-13 -192q13 18 26 0',frown:'M-11 -184q11 -10 22 0',open:'M-13 -184a13 11 0 1 0 26 0a13 11 0 1 0 -26 0',flat:'M-10 -188h20'}[mood];
  const armL=o.flex?'<path d="M-30 -140l-22 -30" stroke="#E7B58F" stroke-width="13" stroke-linecap="round"/><path d="M-52 -170l4 -22" stroke="#E7B58F" stroke-width="13" stroke-linecap="round"/><ellipse cx="-44" cy="-165" rx="9" ry="6" fill="#D9A27A"/>':'<path d="M-30 -140l-20 44" stroke="#E7B58F" stroke-width="13" stroke-linecap="round"/>';
  const armR=o.flex?'<path d="M30 -140l22 -30" stroke="#E7B58F" stroke-width="13" stroke-linecap="round"/><path d="M52 -170l-4 -22" stroke="#E7B58F" stroke-width="13" stroke-linecap="round"/><ellipse cx="44" cy="-165" rx="9" ry="6" fill="#D9A27A"/>':'<path d="M30 -140l20 44" stroke="#E7B58F" stroke-width="13" stroke-linecap="round"/>';
  const tummy=o.tummy?`<ellipse cx="0" cy="-92" rx="${28+o.tummy*14}" ry="${22+o.tummy*10}" fill="#4A94EE"/>`:'';
  let g=`<g class="${o.cls||''}" transform="translate(${o.x||0},${o.y||0}) scale(${s})">`;
  if(o.shield) g+=`<circle cx="0" cy="-120" r="118" fill="none" stroke="#199E70" stroke-width="7" stroke-dasharray="12 10" opacity="${(0.25+0.75*o.shield).toFixed(2)}" class="${o.shieldAnim?'shieldp':''}"/>`;
  g+=`<g class="${o.anim||''}">
  <path d="M-34 -150h68l12 86h-92z" fill="#3987E5"/>${tummy}${armL}${armR}
  <rect x="-30" y="-64" width="24" height="60" rx="9" fill="#E7B58F"/><rect x="6" y="-64" width="24" height="60" rx="9" fill="#E7B58F"/>
  <ellipse cx="-18" cy="-2" rx="16" ry="6" fill="#4A4A4A"/><ellipse cx="18" cy="-2" rx="16" ry="6" fill="#4A4A4A"/>
  <circle cx="0" cy="-200" r="40" fill="#E7B58F"/><path d="M-40 -206c6-38 74-40 80 0-14-10-60-12-80 0z" fill="#3B2A22"/>
  <circle cx="-38" cy="-206" r="8" fill="#3B2A22"/><circle cx="38" cy="-206" r="8" fill="#3B2A22"/><circle cx="-38" cy="-206" r="4" fill="#E8447A"/><circle cx="38" cy="-206" r="4" fill="#E8447A"/>
  <circle cx="-14" cy="-204" r="4.5" fill="#2B2B2B"/><circle cx="14" cy="-204" r="4.5" fill="#2B2B2B"/>
  ${mood==='frown'?'<path d="M-20 -216l10 4M20 -216l-10 4" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round"/>':''}
  <path d="${mouth}" fill="${mood==='open'?'#7A2E2E':'none'}" stroke="#2B2B2B" stroke-width="4" stroke-linecap="round"/>
  ${mood==='big'||mood==='smile'?'<circle cx="-26" cy="-190" r="6" fill="#F4A6A6" opacity=".7"/><circle cx="26" cy="-190" r="6" fill="#F4A6A6" opacity=".7"/>':''}
  </g>`;
  if(o.bolt) g+=`<g class="pop"><path d="M40 -290l-22 34h16l-10 30 26-38h-16z" fill="#E8A317" stroke="#C9870C" stroke-width="2" stroke-linejoin="round"/></g>`;
  if(o.germs) g+=germ(-90,-150,1)+germ(-100,-70,1)+germ(85,-90,1);
  if(o.sweat) g+=`<path d="M48 -226q8 12 0 18q-8-6 0-18z" fill="#7FB4F0"/>`;
  return g+'</g>';
}
function germ(x,y,op){return `<g class="germ" opacity="${op}"><circle cx="${x}" cy="${y}" r="13" fill="#8FBF5A" stroke="#5C8A32" stroke-width="3"/><path d="M${x-17} ${y}h-6M${x+17} ${y}h6M${x} ${y-17}v-6M${x} ${y+17}v6" stroke="#5C8A32" stroke-width="3"/><circle cx="${x-4}" cy="${y-3}" r="2.2" fill="#2B2B2B"/><circle cx="${x+4}" cy="${y-3}" r="2.2" fill="#2B2B2B"/><path d="M${x-4} ${y+5}q4 3 8 0" stroke="#2B2B2B" stroke-width="2" fill="none"/></g>`;}
// group icons
const ICON={
  e:(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><circle r="22" fill="#FBEBC8"/><path d="M4 -16l-12 18h9l-5 15 14-20h-9z" fill="#E8A317" stroke="#C9870C" stroke-width="1.5" stroke-linejoin="round"/></g>`,
  g:(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><circle r="22" fill="#D8E6FA"/><path d="M0 14v-24" stroke="#3987E5" stroke-width="5" stroke-linecap="round"/><path d="M-9 -3l9-11 9 11" fill="none" stroke="#3987E5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M-13 14h26" stroke="#3987E5" stroke-width="4" stroke-linecap="round"/></g>`,
  p:(x,y,s)=>`<g transform="translate(${x},${y}) scale(${s})"><circle r="22" fill="#D2EFE3"/><path d="M0 -15l12 4v9c0 8-5 13-12 16-7-3-12-8-12-16v-9z" fill="#199E70"/><path d="M-5 0l4 4 7-8" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></g>`
};
const GC={e:'#E8A317',g:'#3987E5',p:'#199E70'},GL={e:'#FBEBC8',g:'#D8E6FA',p:'#D2EFE3'};
const GRP={roti:'e',rice:'e',aloo:'e',bread:'e',dal:'g',milk:'g',egg:'g',paneer:'g',banana:'p',apple:'p',sabzi:'p',carrot:'p',chips:'s',ladoo:'s',cola:'s'};
const NAME={roti:'roti',rice:'rice',aloo:'potato sabzi',bread:'bread',dal:'dal',milk:'milk',egg:'egg',paneer:'paneer',banana:'banana',apple:'apple',sabzi:'green sabzi',carrot:'carrot',chips:'chips',ladoo:'ladoo',cola:'cold drink'};

/* ---------------- primitives ---------------- */
function scoop(x,y,s,op,ghost){if(ghost)return `<g transform="translate(${x},${y}) scale(${s})"><ellipse cx="0" cy="2" rx="26" ry="16" fill="#EEF1F4" stroke="#8A96A3" stroke-width="3" stroke-dasharray="6 5"/></g>`;return `<g transform="translate(${x},${y}) scale(${s})" opacity="${op==null?1:op}"><ellipse cx="0" cy="6" rx="26" ry="14" fill="#F4F1E6" stroke="#D9D2BC" stroke-width="2"/><ellipse cx="0" cy="-2" rx="20" ry="12" fill="#FFFDF7" stroke="#E4DCC6" stroke-width="2"/><g fill="#EFE7D0"><circle cx="-8" cy="-4" r="2"/><circle cx="6" cy="-7" r="2"/><circle cx="10" cy="1" r="2"/></g></g>`;}
function plate(cx,cy,r){return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#E6EBF0" stroke="#9AA6B2" stroke-width="3"/><circle cx="${cx}" cy="${cy}" r="${(r*.72).toFixed(0)}" fill="none" stroke="#B8C2CC" stroke-width="2"/>`;}
function bin(x,y,s){return `<g transform="translate(${x},${y}) scale(${s||1})"><path d="M6 24h64l-7 76H13z" fill="#8FA0B0" stroke="#6C7B8A" stroke-width="2"/><rect x="0" y="14" width="76" height="12" rx="4" fill="#6C7B8A"/><rect x="28" y="6" width="20" height="9" rx="3" fill="#6C7B8A"/><path d="M24 40l3 48M38 40v48M52 40l-3 48" stroke="#6C7B8A" stroke-width="2"/></g>`;}
function dragItem(id,f,bad,x,y,s){return `<g class="drag" data-id="${id}" data-home="${x},${y}" style="transform:translate(${x}px,${y}px)"><circle r="${34*s}" fill="#fff" stroke="#E2E7EC" stroke-width="2"/><g transform="translate(${-32*s},${-32*s}) scale(${s})">${foodSVG(f,bad)}</g></g>`;}
function foodAt(f,bad,x,y,s,cls){return `<g class="${cls||''}" transform="translate(${x-32*s},${y-32*s}) scale(${s})">${foodSVG(f,bad)}</g>`;}
function tick(x,y){return `<g class="pop" transform="translate(${x},${y})"><circle r="26" fill="#E6F5EE" stroke="#199E70" stroke-width="4"/><path d="M-12 1l8 8 16-17" fill="none" stroke="#199E70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></g>`;}
function cross(x,y){return `<g class="pop" transform="translate(${x},${y})"><circle r="26" fill="#FBEDEA" stroke="#C0392B" stroke-width="4"/><path d="M-11 -11l22 22M11 -11l-22 22" stroke="#C0392B" stroke-width="5" stroke-linecap="round"/></g>`;}
function meter(x,y,k,v,w){return ICON[k](x,y+9,.75)+`<rect x="${x+30}" y="${y}" width="${w}" height="20" rx="10" fill="${GL[k]}"/><rect x="${x+30}" y="${y}" width="${(w*v).toFixed(1)}" height="20" rx="10" fill="${GC[k]}" style="transition:width .5s"/>`;}
function bubble(x,y,inner,w){w=w||90;return `<g class="pop" transform="translate(${x},${y})"><path d="M${-w/2} -40h${w}a14 14 0 0 1 14 14v40a14 14 0 0 1 -14 14h${-w/2+22}l-14 16-6-16h${-w/2+4}a14 14 0 0 1 -14 -14v-40a14 14 0 0 1 14 -14z" fill="#fff" stroke="#22303C" stroke-width="3"/>${inner}</g>`;}

/* ---------------- audio ---------------- */
let AC=null;
function tone(seq){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*0.9;});}catch(e){}}
const SFX={ok:()=>tone([[660,.12],[880,.14],[1100,.22]]),bad:()=>tone([[330,.18,'triangle'],[260,.3,'triangle']]),munch:()=>tone([[220,.06,'square'],[180,.08,'square']]),pick:()=>tone([[520,.06]]),win:()=>tone([[523,.12],[659,.12],[784,.12],[1047,.3]])};
let voiceOn=true;
function speak(text){$('#spk').classList.remove('talking');if(!voiceOn||!('speechSynthesis'in window))return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);const vs=speechSynthesis.getVoices();const v=vs.find(v=>/en-IN/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang));if(v)u.voice=v;u.lang='en-IN';u.rate=0.85;u.pitch=1.1;u.onstart=()=>$('#spk').classList.add('talking');u.onend=()=>$('#spk').classList.remove('talking');speechSynthesis.speak(u);}catch(e){}}

/* ---------------- state ---------------- */
const stage=$('#stage');
const S={i:0,done:[false,false,false,false,false],score:{1:[],2:[],3:[],4:[]},busy:false,started:false};
let scene=null;
function draw(h){stage.innerHTML=h;}
function anuFeet(){return {x:0,y:0};}

/* ---------------- drag engine ---------------- */
let drag=null;
function pt(e){const p=stage.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(stage.getScreenCTM().inverse());}
stage.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.drag');if(!g||S.busy||drag)return;
  const p=pt(e);const [hx,hy]=g.dataset.home.split(',').map(Number);
  const m=/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/.exec(g.style.transform);const cx=m?+m[1]:hx,cy=m?+m[2]:hy;
  drag={g,id:g.dataset.id,dx:p.x-cx,dy:p.y-cy,home:[hx,hy],pid:e.pointerId};
  g.parentNode.appendChild(g);g.classList.add('lift');stage.setPointerCapture(e.pointerId);SFX.pick();
});
stage.addEventListener('pointermove',e=>{if(!drag)return;const p=pt(e);drag.g.style.transform=`translate(${p.x-drag.dx}px,${p.y-drag.dy}px)`;});
function endDrag(e){
  if(!drag)return;const d=drag;drag=null;d.g.classList.remove('lift');
  const p=pt(e);const x=p.x-d.dx,y=p.y-d.dy;
  let hit=null;(scene.targets||[]).forEach(t=>{const dd=Math.hypot(x-t.x,y-t.y);if(dd<t.r&&(!hit||dd<hit.d))hit={t,d:dd};});
  const keep=hit?scene.drop(d.id,hit.t.id,d.g,x,y):false;
  if(!keep)d.g.style.transform=`translate(${d.home[0]}px,${d.home[1]}px)`;
}
stage.addEventListener('pointerup',endDrag);stage.addEventListener('pointercancel',endDrag);
function snap(g,x,y){g.style.transform=`translate(${x}px,${y}px)`;}
function vanish(g){g.classList.add('gone');}
function mark(ok,x,y){const el=document.createElementNS('http://www.w3.org/2000/svg','g');el.innerHTML=ok?tick(x,y):cross(x,y);stage.appendChild(el);setTimeout(()=>el.remove(),1100);}
function first(k,ok){if(!scene.tried[k]){scene.tried[k]=true;S.score[S.i+1].push(ok);}}

/* ---------------- scene 1: clean or dirty ---------------- */
const SC1={
  line:'Look at the food. Put the clean food on the plate. Put the dirty food in the bin.',
  items:[{f:'roti'},{f:'roti',bad:'floor'},{f:'banana'},{f:'milk',bad:'sour'},{f:'dal'},{f:'bread',bad:'mould'}],
  targets:[{id:'plate',x:190,y:470,r:135},{id:'bin',x:465,y:440,r:95}],
  enter(){this.placed={};this.tried={};this.mood='smile';this.fx='';this.render();},
  render(){
    let h=`<rect x="20" y="134" width="660" height="10" rx="5" fill="#D9BE94"/>`+plate(190,470,125)+bin(408,350,1.5);
    const n=Object.keys(this.placed).filter(k=>this.placed[k]==='plate').length;
    let slot=0;
    this.items.forEach((it,i)=>{
      if(this.placed[i]==='plate'){const a=(-90+slot*60)*Math.PI/180;h+=foodAt(it.f,null,190+68*Math.cos(a),470+68*Math.sin(a),1.3,'pop');slot++;}
      else if(!this.placed[i]) h+=dragItem(i,it.f,it.bad,80+i*108,80,1.35);
    });
    h+=anu({x:600,y:680,scale:.75,mood:this.mood,germs:this.fx==='germs',sweat:this.fx==='sweat',anim:this.fx==='happy'?'bounce':''});
    if(this.fx==='puff')h+=`<g class="puff">${germ(430,330,1)}${germ(470,318,1)}${germ(505,335,1)}</g>`;
    draw(h);
  },
  drop(id,t,g,x,y){
    const it=this.items[id];const ok=(t==='bin')===!!it.bad;first(id,ok);
    if(ok){this.placed[id]=t;this.mood='big';this.fx=t==='bin'?'puff':'happy';SFX.ok();mark(true,x,y-70);
      setTimeout(()=>{this.render();if(Object.keys(this.placed).length===this.items.length)finishScene();},350);
      if(t==='bin')vanish(g);else{const k=Object.values(this.placed).filter(v=>v==='plate').length-1;const a=(-90+k*60)*Math.PI/180;snap(g,190+72*Math.cos(a),470+72*Math.sin(a));}
      return true;}
    this.mood='frown';this.fx=it.bad?'germs':'sweat';SFX.bad();mark(false,x,y-70);this.render();
    setTimeout(()=>{this.mood='smile';this.fx='';this.render();},1400);return false;
  }
};

/* ---------------- scene 2: feed Anu ---------------- */
const SC2={
  line:'Feed Anu. Watch what each food does inside her.',
  feed:['roti','milk','apple'],
  prompts:[{k:'e',opts:['dal','rice','carrot'],a:'rice',line:'Anu wants to run fast. Give her an energy food.'},{k:'g',opts:['banana','egg','roti'],a:'egg',line:'Anu wants to grow tall and strong. Give her a growing food.'},{k:'p',opts:['bread','paneer','carrot'],a:'carrot',line:'Germs are coming! Give Anu a food that protects her.'}],
  targets:[{id:'mouth',x:200,y:330,r:95}],
  enter(){this.m={e:0,g:0,p:0};this.fed={};this.phase='feed';this.pi=0;this.tried={};this.mood='open';this.fx='';this.render();},
  tray(list,ids){return list.map((f,i)=>dragItem(ids?ids[i]:f,f,null,160+i*190,90,1.5));},
  render(){
    let h='';
    const pr=this.prompts[this.pi];
    if(this.phase==='feed')h+=this.tray(this.feed.filter(f=>!this.fed[f])).join('');
    else if(this.phase==='ask')h+=this.tray(pr.opts).join('')+bubble(200,250,ICON[pr.k](0,-6,1.1),90);
    h+=anu({x:200,y:640,scale:1.3,mood:this.mood,anim:this.fx==='e'?'bounce':this.fx==='g'?'flex':'',flex:this.fx==='g',shield:this.m.p,shieldAnim:this.fx==='p',bolt:this.fx==='e',germs:this.phase==='ask'&&pr.k==='p'&&this.fx!=='p',sweat:this.fx==='bad'});
    h+=meter(400,340,'e',this.m.e,240)+meter(400,420,'g',this.m.g,240)+meter(400,500,'p',this.m.p,240);
    draw(h);
  },
  eat(f){const k=GRP[f];this.m[k]=Math.min(1,this.m[k]+(k==='s'?0:0.5));this.fx=k;this.mood='big';SFX.munch();this.render();setTimeout(()=>{this.fx='';this.mood='open';this.render();},1300);},
  drop(id,t,g){
    if(this.phase==='feed'){this.fed[id]=true;vanish(g);this.eat(id);
      if(Object.keys(this.fed).length===this.feed.length)setTimeout(()=>{this.phase='ask';this.mood='open';this.render();speak(this.prompts[0].line);},1500);
      return true;}
    const pr=this.prompts[this.pi];const ok=id===pr.a;first('p'+this.pi,ok);
    if(ok){vanish(g);SFX.ok();this.eat(id);
      setTimeout(()=>{this.pi++;if(this.pi>=this.prompts.length){this.phase='end';this.mood='big';this.render();finishScene();}else{this.render();speak(this.prompts[this.pi].line);}},1500);return true;}
    this.fx='bad';this.mood='frown';SFX.bad();this.render();setTimeout(()=>{this.fx='';this.mood='open';this.render();},1200);return false;
  }
};

  targets:[{id:'bowl',x:350,y:180,r:80}],
  enter(){this.r=0;this.tried={};this.fx='';this.mood='smile';this.render();},
  render(){
    const R=this.rounds[this.r];const miss=['e','g','p'].find(k=>!R.have.some(f=>GRP[f]===k));
    let h=plate(350,270,170);
    h+=`<circle cx="268" cy="322" r="56" fill="#fff" stroke="#B8C2CC" stroke-width="2"/><circle cx="432" cy="322" r="56" fill="#fff" stroke="#B8C2CC" stroke-width="2"/>`;

    else{h+=`<circle cx="350" cy="176" r="56" fill="#fff" stroke="#199E70" stroke-width="4" stroke-dasharray="9 7" class="blink"/><text x="350" y="194" text-anchor="middle" font-family="Nunito,sans-serif" font-size="46" font-weight="800" fill="#199E70">?</text>`;
      if(R.cue)h+=ICON[miss](350,90,.9);}

  drop(id,t,g,x,y){

    this.fx='bad';this.mood='frown';SFX.bad();mark(false,x,y-70);this.render();setTimeout(()=>{this.fx='';this.mood='smile';this.render();},1200);return false;

    h+=anu({x:190,y:640,scale:1.2,mood:this.mood,tummy:this.state==='full'?1:0,sweat:this.state==='full'});

    // pot + plate + rice scoops
        h+=`<g transform="translate(530,150)"><path d="M-90 0h180l-18 60h-144z" fill="#CFD6DE" stroke="#9AA6B2" stroke-width="3"/><ellipse cx="0" cy="0" rx="90" ry="22" fill="#B8C2CC"/>${scoop(0,-14,2.2)}</g>`;

    for(let i=0;i<=6;i++)h+=`<circle cx="${sx+i*sw/6}" cy="${sy}" r="4" fill="#fff"/>`;

    h+=scoop(sx-40,sy,.5,.8);

    h+=plate(520,540,70)+tick(520,540);
    h+=`<g id="star" style="cursor:pointer" transform="translate(600,650)"><circle r="44" fill="#FFF3D6"/><path d="M0 -30l9 18 20 3-14 14 3 20-18-9-18 9 3-20-14-14 20-3z" fill="#E8A317" stroke="#C9870C" stroke-width="2" stroke-linejoin="round"/></g>`;
    draw(h);
    stage.querySelector('#star').addEventListener('click',()=>{SFX.win();this.render();});
  },
  drop(){return false;}
};

/* ---------------- flow ---------------- */
const SCENES=[SC1,SC2,SC3,SC4,SC5];
function enterScene(i){S.i=i;scene=SCENES[i];S.busy=false;drag=null;scene.enter();renderNav();speak(scene.line);}
function finishScene(){S.done[S.i]=true;renderNav();if(S.i<4)SFX.win();}
function renderNav(){
  $('#dots').innerHTML=SCENES.map((s,i)=>`<i class="${i===S.i?'on':S.done[i]?'done':''}"></i>`).join('');
  const go=$('#goBtn');go.disabled=!S.done[S.i]||S.i===4;go.classList.toggle('ready',S.done[S.i]&&S.i<4);
  $('#backBtn').classList.toggle('hidden',S.i===0);
}
$('#goBtn').addEventListener('click',()=>{if(S.i<4)enterScene(S.i+1);});
$('#backBtn').addEventListener('click',()=>{if(S.i>0)enterScene(S.i-1);});
$('#spk').addEventListener('click',()=>{const t=scene===SC2&&SC2.phase==='ask'?SC2.prompts[SC2.pi].line:scene.line;speak(t);});
$('#playBtn').addEventListener('click',()=>{S.started=true;$('#start').classList.add('hidden');try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();}catch(e){}enterScene(0);});

/* ---------------- teacher panel ---------------- */
const RUB=[['1 Clean or dirty','C1.1-S1-L1 · S1-L2','6 drags: clean → plate, dirty → bin'],['2 Feed Anu','C1.1-S2-L1 · S2-L2','3 free feeds, then 3 prompts by picture'],['3 Empty bowl','C1.1-S2-L3 · S2-L4','4 rounds; first 2 with a cue icon, last 2 without'],['4 Take a little','C1.1-S4-L4 "Serve it right"','3 rounds: match tummy room, no leftovers']];
function openPanel(){
  const sc=S.score;
  $('#panelIn').innerHTML=`<button class="x" id="px">×</button><h2>Teacher</h2><p>Tiffin Time · Foundational Stage · Physical Development · CG-1 · C-1.1. Scores count the first attempt at each drag.</p>
  <div class="sc">${RUB.map((r,i)=>`<b>${r[0]}</b><span class="d">${(sc[i+1]||[]).map(v=>`<i class="${v?'y':'n'}"></i>`).join('')||'<span style="color:var(--mute);font-size:12px">not yet</span>'}</span><button data-go="${i}">Open</button>`).join('')}<b>5 Well done</b><span></span><button data-go="4">Open</button></div>
  <h3>What each scene assesses</h3><ul>${RUB.map(r=>`<li><code>${r[1]}</code> — ${r[2]}</li>`).join('')}</ul>
  <h3>Using it with a class</h3><ul><li>One child at the screen, others call out: "plate or bin?"</li><li>Ask before each drag: "Why?" — the child says it, the screen shows it.</li><li>After scene 2, open a real tiffin and find one food for each friend: energy, grow, protect.</li><li>Trying new foods (S3) and eating neatly (S4-L1 to L3) stay as mealtime checklists.</li></ul>
  <div class="row"><button id="voiceT">${voiceOn?'Voice: on':'Voice: off'}</button><button id="restart" class="p">Restart</button></div>`;
  $('#panel').classList.remove('hidden');
  $('#px').addEventListener('click',closePanel);
  $$('#panelIn [data-go]').forEach(b=>b.addEventListener('click',()=>{closePanel();if(!S.started)$('#playBtn').click();enterScene(+b.dataset.go);}));
  $('#voiceT').addEventListener('click',()=>{voiceOn=!voiceOn;if(!voiceOn&&'speechSynthesis'in window)speechSynthesis.cancel();openPanel();});
  $('#restart').addEventListener('click',()=>{S.done=[false,false,false,false,false];S.score={1:[],2:[],3:[],4:[]};closePanel();if(!S.started)$('#playBtn').click();else enterScene(0);});
}
function closePanel(){$('#panel').classList.add('hidden');}
$('#teacherBtn').addEventListener('click',openPanel);

/* ---------------- start art ---------------- */
(function(){
  $('#startArt').innerHTML=`<rect width="320" height="300" rx="24" fill="#fff"/>`+anu({x:110,y:270,scale:.95,mood:'big'})+plate(240,150,60)+foodAt('roti',null,215,165,.6)+foodAt('dal',null,265,165,.6)+foodAt('banana',null,240,125,.6)+ICON.e(200,90,.6)+ICON.g(280,90,.6)+ICON.p(240,60,.6);
  if('speechSynthesis'in window)speechSynthesis.getVoices();
  if(new URLSearchParams(location.search).get('role')==='teacher')$('#teacherBtn').classList.add('on');
  window.__sim={S,SCENES,enterScene,get scene(){return scene;},SC1,SC2,SC3,SC4,SC5,finishScene};
})();
</script>
